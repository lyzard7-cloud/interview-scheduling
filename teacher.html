  <script>
    tailwind.config = {
      theme: {

          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: {
            brand: {

              purple: '#7c3aed',

              orange: '#ff7a00',

    };

    let STUDENT_LIST = JSON.parse(localStorage.getItem('mock_student_list') || '[]');

    const DEFAULT_TEACHER_A = ["최명호", "전명치", "백홍", "엄혜진", "정해린"];

    let TEACHER_B_GROUP = JSON.parse(localStorage.getItem('mock_teacher_b_group') || JSON.stringify(DEFAULT_TEACHER_B));
    let ALL_TEACHERS = Array.from(new Set([...TEACHER_A_GROUP, ...TEACHER_B_GROUP]));

    let ADMIN_PASSWORD = localStorage.getItem('mock_admin_password') || '01054568795';

    let TEACHER_SCHEDULE = JSON.parse(localStorage.getItem('mock_teacher_schedule') || JSON.stringify({
      "2026-10-05": [],
      "2026-10-06": ["정해린", "최명호"],
      "2026-10-07": ["원선보", "이진경", "백홍", "이나경", "조아영"],
      "2026-10-08": ["엄혜진", "원선보", "신이현", "정해린", "최명호"],
      "2026-10-09": [],
      "2026-10-12": ["신이현", "이진경", "백홍", "이나경", "정해린"],
      "2026-10-13": ["신이현", "조아영", "정해린", "최명호", "전명치"],
      "2026-10-14": ["원선보", "이진경", "백홍", "이나경", "조아영"],
      "2026-10-15": ["엄혜진", "원선보", "신이현", "정해린", "최명호", "전명치"],
      "2026-10-16": ["김준형", "엄혜진", "원선보", "신이현", "이진경", "백홍", "이나경", "조아영", "정해린"],
      "2026-10-19": ["신이현", "이진경", "백홍", "이나경", "정해린"],
      "2026-10-20": ["원선보", "신이현", "이진경", "백홍", "이나경", "조아영", "정해린", "최명호", "전명치"],
      "2026-10-21": ["원선보", "백홍", "이나경", "조아영"],
      "2026-10-22": ["엄혜진", "원선보", "신이현", "정해린", "최명호", "전명치"],
      "2026-10-23": ["김준형", "엄혜진", "원선보", "신이현", "이진경", "백홍", "이나경", "조아영", "정해린"],
      "2026-10-26": ["신이현", "백홍", "이나경", "정해린"],
      "2026-10-27": ["신이현", "이진경", "조아영", "정해린", "최명호", "전명치"],
      "2026-10-28": ["원선보", "이진경", "백홍", "이나경", "조아영", "전명치"],
      "2026-10-29": ["엄혜진", "원선보", "신이현", "정해린", "최명호", "전명치"],
      "2026-10-30": ["김준형", "엄혜진", "원선보", "신이현", "이진경", "백홍", "이나경", "조아영", "정해린", "전명치"]
    }));

    const DEFAULT_CLOSED_DATES = ["2026-10-05", "2026-10-09"];

    let state = {
      year: 2026,
      month: 10,
      teacherTab: 'list',
      editingTeacherId: null,
      selectedTeacherDates: [],
      searchKeyword: '',
      evalSearchKeyword: '',
      realReviewKeyword: '',
      dateFilter: '',
      isTodayOnly: false,
      viewLayoutMode: localStorage.getItem('teacher_preferred_layout') || '2',
      expandedRowIds: [],
      closedDates: JSON.parse(localStorage.getItem('mock_closed_dates') || JSON.stringify(DEFAULT_CLOSED_DATES)),
      regs: JSON.parse(localStorage.getItem('mock_regs') || '[]'),
      realReviews: JSON.parse(localStorage.getItem('mock_real_reviews') || '[]')
    };

    document.addEventListener('DOMContentLoaded', () => {
      syncDatabase();
      updateSidebarNavForTeacher();
      renderTeacherView();
    });

    function goToStudentPage() {
      window.location.href = './index.html';
    }

    function changeViewLayoutMode(modeVal) {
      state.viewLayoutMode = modeVal;
      localStorage.setItem('teacher_preferred_layout', modeVal);
      renderTeacherListView();
    }

    function toggleRowExpansion(id) {
      if (state.expandedRowIds.includes(id)) {
        state.expandedRowIds = state.expandedRowIds.filter(item => item !== id);
      } else {
        state.expandedRowIds.push(id);
      }
      renderTeacherListView();
    }

    function updateSidebarNavForTeacher() {
      const nav = document.getElementById('sidebarNav');
      if (!nav) return;
      nav.innerHTML = `
        <button onclick="switchTeacherTab('calendar')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'calendar' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-calendar-days mr-2"></i>달력 일정 및 마감 관리</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('schedule')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'schedule' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-user-gear mr-2"></i>날짜별 참여 교사 관리</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('list')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'list' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-list-check mr-2"></i>면접 예약 현황 목록</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('evals')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'evals' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-file-signature mr-2 text-indigo-600"></i>학생 면접 평가지 관리</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('realReviews')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'realReviews' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-book-bookmark mr-2 text-brand-orange"></i>실제 면접 후기 DB</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('stats')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'stats' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-chart-pie mr-2"></i>면접교사 배정 통계</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('admin')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'admin' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-user-shield mr-2"></i>교사 관리자 전용</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="goToStudentPage()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold transition-all mt-3 pt-3 border-t whitespace-nowrap">
          <span><i class="fa-solid fa-user-graduate mr-2 text-brand-purple"></i>학생 사이트로 이동</span>
          <i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>
        </button>
      `;
    }

    function switchTeacherTab(tabName) {
      if (tabName === 'admin') {
        const inputPwd = prompt('관리자 전용 비밀번호를 입력해 주세요:');
        if (inputPwd !== ADMIN_PASSWORD) {
          alert('비밀번호가 올바르지 않습니다.');
          return;
        }
      }
      state.teacherTab = tabName;
      updateSidebarNavForTeacher();
      renderTeacherView();
    }

    function syncDatabase() {
      if (window.isFirebaseReady && window.dbTools) {
        try {
          const { collection, onSnapshot } = window.dbTools;
          
          onSnapshot(collection(window.db, 'interview_registrations'), (snapshot) => {
            state.regs = [];
            snapshot.forEach(doc => state.regs.push(doc.data()));
            localStorage.setItem('mock_regs', JSON.stringify(state.regs));
            renderTeacherView();
          });

          onSnapshot(collection(window.db, 'interview_students'), (snapshot) => {
            const remoteStudentList = [];
            snapshot.forEach(doc => remoteStudentList.push(doc.data()));
            if (remoteStudentList.length > 0) {
              STUDENT_LIST = remoteStudentList;
              localStorage.setItem('mock_student_list', JSON.stringify(STUDENT_LIST));
              if (state.teacherTab === 'admin') renderTeacherAdminView();
            }
          });

          onSnapshot(collection(window.db, 'interview_real_reviews'), (snapshot) => {
            state.realReviews = [];
            snapshot.forEach(doc => state.realReviews.push(doc.data()));
            localStorage.setItem('mock_real_reviews', JSON.stringify(state.realReviews));
            if (state.teacherTab === 'realReviews') renderTeacherRealReviewsView();
          });

          onSnapshot(collection(window.db, 'interview_settings'), (snapshot) => {
            snapshot.forEach(doc => {
              if (doc.id === 'closed_dates') {
                state.closedDates = doc.data().dates || [];
                localStorage.setItem('mock_closed_dates', JSON.stringify(state.closedDates));
                renderTeacherView();
              } else if (doc.id === 'teacher_schedule') {
                TEACHER_SCHEDULE = doc.data().schedule || TEACHER_SCHEDULE;
                localStorage.setItem('mock_teacher_schedule', JSON.stringify(TEACHER_SCHEDULE));
                renderTeacherView();
              } else if (doc.id === 'teacher_roster') {
                const data = doc.data();
                if (data.groupA && data.groupB) {
                  TEACHER_A_GROUP = data.groupA;
                  TEACHER_B_GROUP = data.groupB;
                  ALL_TEACHERS = Array.from(new Set([...TEACHER_A_GROUP, ...TEACHER_B_GROUP]));
                  localStorage.setItem('mock_teacher_a_group', JSON.stringify(TEACHER_A_GROUP));
                  localStorage.setItem('mock_teacher_b_group', JSON.stringify(TEACHER_B_GROUP));
                  renderTeacherView();
                }
              }
            });
          });
        } catch(e) { console.warn("Firestore Listener Error", e); }
      }
    }

    function renderTeacherView() {
      if (state.teacherTab === 'calendar') {
        renderTeacherCalendarView();
      } else if (state.teacherTab === 'stats') {
        renderTeacherStatsView();
      } else if (state.teacherTab === 'schedule') {
        renderTeacherScheduleView();
      } else if (state.teacherTab === 'admin') {
        renderTeacherAdminView();
      } else if (state.teacherTab === 'evals') {
        renderTeacherEvalsView();
      } else if (state.teacherTab === 'realReviews') {
        renderTeacherRealReviewsView();
      } else {
        renderTeacherListView();
      }
    }

    function renderTeacherListView() {
      const main = document.getElementById('mainContent');
      if (!main) return;

      const uniqueDates = Array.from(new Set(state.regs.map(r => r.date))).sort();
      const dateSelectOptions = uniqueDates.map(d => `<option value="${d}" ${state.dateFilter === d ? 'selected' : ''}>${d}</option>`).join('');

      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const todayRegsCount = state.regs.filter(r => r.date === todayStr).length;

    async function toggleTeacherForDate(dateStr, teacherName, isChecked) {
      if (!TEACHER_SCHEDULE[dateStr]) TEACHER_SCHEDULE[dateStr] = [];
      
      if (isChecked) {
        if (!TEACHER_SCHEDULE[dateStr].includes(teacherName)) {

        }
      } else {
        TEACHER_SCHEDULE[dateStr] = TEACHER_SCHEDULE[dateStr].filter(t => t !== teacherName);
      }

      await saveTeacherScheduleToDb();
      renderTeacherScheduleView();

    function getTeacherWorkloadCounts() {
      const counts = {};
      ALL_TEACHERS.forEach(t => counts[t] = 0);

      state.regs.forEach(r => {
        if (r.teacher1) counts[r.teacher1] = (counts[r.teacher1] || 0) + 1;
        if (r.teacher2) counts[r.teacher2] = (counts[r.teacher2] || 0) + 1;
      });
      return counts;

    async function updateLocation(id, newLoc) {

        localStorage.setItem('mock_regs', JSON.stringify(state.regs));

      if (state.selectedTeacherDates.includes(dateStr)) {

        state.selectedTeacherDates.push(dateStr);

      renderTeacherCalendarView();
      showTeacherDateDetail(dateStr);

    function selectAllTeacherMonthDates() {
      const lastDate = new Date(state.year, state.month, 0).getDate();
      state.selectedTeacherDates = [];
      for (let d = 1; d <= lastDate; d++) {
        state.selectedTeacherDates.push(`${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
      }
      renderTeacherCalendarView();
    }

    function clearSelectedTeacherDates() {
      state.selectedTeacherDates = [];
      renderTeacherCalendarView();
    }

    async function applySelectedBulkClose(isClose) {
      if (state.selectedTeacherDates.length === 0) {
        alert('달력에서 일괄 변경할 날짜를 먼저 클릭하여 선택해 주세요.');
        return;
      }

      let count = 0;
      state.selectedTeacherDates.forEach(dStr => {
        if (isClose) {
          if (!state.closedDates.includes(dStr)) {
            state.closedDates.push(dStr);
            count++;
          }
        } else {
          if (state.closedDates.includes(dStr)) {
            state.closedDates = state.closedDates.filter(d => d !== dStr);
            count++;
          }
        }
      });

      await saveClosedDatesToDb();
      alert(`선택한 ${state.selectedTeacherDates.length}개 중 ${count}개 날짜가 일괄 ${isClose ? '마감' : '해제'} 처리되었습니다.`);
      state.selectedTeacherDates = [];
      renderTeacherCalendarView();
    }

    async function applyWeekendClose(isClose) {
      const lastDate = new Date(state.year, state.month, 0).getDate();
      let count = 0;

      for (let d = 1; d <= lastDate; d++) {
        const dateObj = new Date(state.year, state.month - 1, d);
        const day = dateObj.getDay();
        if (day === 0 || day === 6) {
          const dStr = `${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          if (isClose) {
            if (!state.closedDates.includes(dStr)) {
              state.closedDates.push(dStr);
              count++;
            }
          }
        }
      }

      await saveClosedDatesToDb();
      alert(`${state.month}월 모든 주말(토/일)이 일괄 마감 처리되었습니다.`);
      renderTeacherCalendarView();
    }

      const dayRegs = state.regs.filter(r => r.date === dateStr);
      const availTeachers = TEACHER_SCHEDULE[dateStr] || [];
      const maxTeams = getMaxTeamsForDate(dateStr);

      let listHtml = dayRegs.map(r => {
        const assignedTeachers = [r.teacher1, r.teacher2].filter(Boolean);
        const teacherBadge = assignedTeachers.length > 0 
          ? `<span class="bg-brand-purpleLight text-brand-purple px-2 py-0.5 rounded font-bold text-xs whitespace-nowrap">담당: ${assignedTeachers.join(', ')}</span>`
          : `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold text-xs whitespace-nowrap">미배정</span>`;

        return `
          <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-xs border border-slate-200 flex-wrap gap-2">
            <div class="flex items-center space-x-2">
              <span class="font-extrabold text-brand-purple bg-white px-2 py-1 rounded border border-brand-purple/30 whitespace-nowrap">[${r.period}교시]</span>
              <div>
                <span class="font-bold text-slate-900 text-xs sm:text-sm whitespace-nowrap">${r.name} (${r.num})</span>
                <span class="text-slate-500 ml-1.5 whitespace-nowrap">${r.univ} ${r.dept}</span>
                ${r.note ? `<span class="text-amber-700 font-medium ml-1.5 whitespace-nowrap">(${r.note})</span>` : ''}
                <span class="text-brand-purple font-bold ml-1.5 whitespace-nowrap">장소: ${r.location || '3학년 교무실'}</span>
              </div>
            </div>
            <div class="flex items-center space-x-2 self-end sm:self-auto whitespace-nowrap">
              ${teacherBadge}
              <button onclick="openOnlineEvalModal('${r.id}')" class="bg-brand-purple text-white px-2 py-1 rounded-lg font-bold text-xs whitespace-nowrap">📝 온라인 평가지</button>
              <button onclick="deleteRegistration('${r.id}')" class="text-red-500 hover:text-red-700 font-bold underline ml-1 whitespace-nowrap">삭제</button>
            </div>
          </div>
        `;
      }).join('') || '<div class="text-xs text-slate-400 py-3 text-center bg-slate-50 rounded-xl border border-dashed border-slate-200 whitespace-nowrap">이 날짜에 신청된 면접 예약이 없습니다.</div>';

      container.classList.remove('hidden');
      container.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-brand-purpleLight/50 p-3.5 sm:p-4 rounded-xl border border-brand-purple/20 gap-2">
          <div>
            <h4 class="font-bold text-slate-900 text-xs sm:text-sm whitespace-nowrap">📅 ${dateStr} 신청 현황 (정원: 8교시 ${maxTeams}명 / 9교시 ${maxTeams}명)</h4>
            <p class="text-[11px] sm:text-xs text-slate-600 mt-0.5 whitespace-nowrap">가능 교사: <strong>${availTeachers.length > 0 ? availTeachers.join(', ') : '없음/공휴일'}</strong></p>
          </div>
          <div class="flex items-center space-x-2 self-end sm:self-auto whitespace-nowrap">
            <button onclick="printDatePreQuestions('${dateStr}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl transition-all shadow-sm whitespace-nowrap">
              📄 사전 질문지 일괄 인쇄
            </button>
            <button onclick="printEvaluationSheet('${dateStr}')" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl transition-all shadow-sm whitespace-nowrap">
              📄 평가 기록지 인쇄
            </button>
            <button onclick="toggleDateClosed('${dateStr}')" class="${isClosed ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-500 hover:bg-red-600'} text-white text-xs font-bold px-3 py-1.5 rounded-xl transition-all shadow-sm whitespace-nowrap">
              ${isClosed ? '마감 해제' : '개별 마감'}
            </button>
          </div>
        </div>
        <div class="space-y-2 pt-1">
          ${listHtml}
        </div>
      `;
    }

    async function toggleDateClosed(dateStr) {
      if (state.closedDates.includes(dateStr)) {
        state.closedDates = state.closedDates.filter(d => d !== dateStr);
        alert(`${dateStr} 날짜가 정상 운영(예약 가능)으로 재개되었습니다.`);
      } else {
        state.closedDates.push(dateStr);
        alert(`${dateStr} 날짜가 마감 처리되었습니다.`);
      }
      await saveClosedDatesToDb();
      renderTeacherCalendarView();
      showTeacherDateDetail(dateStr);
    }

    async function saveTeachers(id) {
      const t1 = document.getElementById(`t1Input_${id}`)?.value || '';
      const t2 = document.getElementById(`t2Input_${id}`)?.value || '';

      const reg = state.regs.find(r => r.id === id);
      if (reg) {
        reg.teacher1 = t1;
        reg.teacher2 = t2;
        localStorage.setItem('mock_regs', JSON.stringify(state.regs));

        if (window.isFirebaseReady && window.dbTools) {
          try {
            const { doc, setDoc } = window.dbTools;
            await setDoc(doc(window.db, 'interview_registrations', id), reg);
          } catch(e) { console.warn("Firestore Teacher Save Error", e); }
        }

        state.editingTeacherId = null;
        alert(`담당 면접교사가 완벽히 저장되었습니다.`);
        renderTeacherView();
      }
    }

    async function deleteRegistration(id) {
      if (!confirm('이 학생의 면접 예약 내역을 취소/삭제하시겠습니까?')) return;
      state.regs = state.regs.filter(r => r.id !== id);
      localStorage.setItem('mock_regs', JSON.stringify(state.regs));

      if (window.isFirebaseReady && window.dbTools) {
        try {
          const { doc, deleteDoc } = window.dbTools;
          await deleteDoc(doc(window.db, 'interview_registrations', id));
        } catch(e) { console.warn("Delete Firestore Error", e); }
      }

      renderTeacherView();
      alert('예약 내역이 삭제되었습니다.');
    }

    function changeMonth(delta) {
      state.month += delta;
      if (state.month < 1) {
        state.month = 12;
        state.year -= 1;
      } else if (state.month > 12) {
        state.month = 1;
        state.year += 1;
      }
      
      const monText = document.getElementById('calMonthText');
      if (monText) monText.textContent = `${state.year}년 ${state.month}월`;
      
      state.selectedTeacherDates = [];
      renderTeacherView();
    }
  </script>
</body>
</html>
