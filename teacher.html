<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강일여자고등학교 3학년부 - 대입 면접 교사 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @font-face {
      font-family: 'BMJUA';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    .font-jua { font-family: 'BMJUA', 'Pretendard', sans-serif; }
    .custom-scroll::-webkit-scrollbar { height: 4px; width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>

  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: {
            brand: {
              navy: '#1e1e2d',
              purple: '#7c3aed',
              purpleLight: '#f3e8ff',
              orange: '#ff7a00'
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <header class="bg-brand-navy text-white shadow-md no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex justify-between items-center text-xs border-b border-slate-700">
      <div class="flex items-center space-x-3 text-slate-300">
        <span class="font-bold text-white"><i class="fa-solid fa-school text-brand-orange"></i> 강일여고 3학년부</span>
        <span>|</span>
        <span>2026 수시 맞춤형 면접 (교사 전용)</span>
      </div>
    </div>
    
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex justify-between items-center">
      <h1 class="text-2xl font-extrabold text-white font-jua">강일여고 교사용 면접 관리 시스템</h1>
      <div class="text-xs text-slate-300 bg-slate-800 px-4 py-2 rounded-full border border-slate-700 flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-yellow-400"></span>
        <span class="text-brand-orange font-bold"><i class="fa-solid fa-user-shield"></i> 교사 관리자 접속됨</span>
      </div>
    </div>
  </header>

  <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 flex-1 flex flex-col md:flex-row gap-6 no-print">
    <aside class="w-full md:w-64 shrink-0 space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <div class="bg-brand-purple text-white p-3 rounded-xl font-bold text-sm flex justify-between items-center">
          <span>교사 관리 포털</span>
          <i class="fa-solid fa-bars"></i>
        </div>
        <nav class="space-y-1 text-xs sm:text-sm font-medium pt-3" id="sidebarNav">
          <button onclick="switchTab('calendar')" id="tabBtn_calendar" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-calendar-days mr-2"></i>달력 일정 및 마감 관리</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('schedule')" id="tabBtn_schedule" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-user-gear mr-2"></i>날짜별 참여 교사 관리</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('list')" id="tabBtn_list" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg bg-brand-purpleLight text-brand-purple font-bold mb-1">
            <span><i class="fa-solid fa-list-check mr-2"></i>면접 예약 현황 목록</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('evals')" id="tabBtn_evals" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-file-signature mr-2 text-indigo-600"></i>학생 면접 평가지 관리</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('realReviews')" id="tabBtn_realReviews" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-book-bookmark mr-2 text-brand-orange"></i>실제 면접 후기 DB</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('stats')" id="tabBtn_stats" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-chart-pie mr-2"></i>면접교사 배정 통계</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('admin')" id="tabBtn_admin" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-user-shield mr-2"></i>교사 관리자 전용</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="goToStudentPage()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold mt-3 pt-3 border-t">
            <span><i class="fa-solid fa-user-graduate mr-2 text-brand-purple"></i>학생 사이트로 이동</span>
            <i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>
          </button>
        </nav>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 text-xs space-y-1">
        <p class="font-bold text-slate-800"><i class="fa-solid fa-headset text-brand-purple mr-1"></i> 시스템 문의</p>
        <p class="text-slate-500">3학년 교무실</p>
        <p class="text-slate-700 font-semibold">033-650-0783 (내선 783)</p>
      </div>
    </aside>

    <main class="flex-1 space-y-6 min-w-0" id="mainContent">
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <h3 class="text-lg font-bold text-slate-900">면접 관리 시스템 로딩 중...</h3>
        <p class="text-xs text-slate-500 mt-2">잠시만 기다려주세요.</p>
      </section>
    </main>
  </div>

  <div id="printArea" class="p-8 space-y-6"></div>

  <footer class="bg-slate-900 text-slate-400 py-5 text-center text-xs mt-auto no-print">
    <p>© 강일여자고등학교 3학년부 대입 면접 연습 배정 시스템. All rights reserved.</p>
  </footer>

  <script>
    var STUDENT_LIST = JSON.parse(localStorage.getItem('mock_student_list') || '[]');
    var TEACHER_A_GROUP = JSON.parse(localStorage.getItem('mock_teacher_a_group') || '["최명호", "전명치", "백홍", "엄혜진", "정해린"]');
    var TEACHER_B_GROUP = JSON.parse(localStorage.getItem('mock_teacher_b_group') || '["원선보", "이나경", "조아영", "이진경", "김준형", "신이현"]');
    var ALL_TEACHERS = Array.from(new Set([...TEACHER_A_GROUP, ...TEACHER_B_GROUP]));
    var ADMIN_PASSWORD = localStorage.getItem('mock_admin_password') || '01054568795';

    var state = {
      teacherTab: 'list',
      searchKeyword: '',
      dateFilter: '',
      isTodayOnly: false,
      viewLayoutMode: localStorage.getItem('teacher_preferred_layout') || '2',
      expandedRowIds: [],
      regs: JSON.parse(localStorage.getItem('mock_regs') || '[]')
    };

    function goToStudentPage() {
      window.location.href = './index.html';
    }

    function switchTab(tab) {
      if (tab === 'admin') {
        var pwd = prompt('비밀번호를 입력하세요:');
        if (pwd !== ADMIN_PASSWORD) {
          alert('비밀번호가 올바르지 않습니다.');
          return;
        }
      }
      state.teacherTab = tab;
      
      var navBtns = document.querySelectorAll('#sidebarNav button');
      navBtns.forEach(function(btn) {
        if (btn.id === 'tabBtn_' + tab) {
          btn.className = "w-full flex items-center justify-between px-3 py-2.5 rounded-lg bg-brand-purpleLight text-brand-purple font-bold mb-1";
        } else if (btn.id) {
          btn.className = "w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1";
        }
      });

      renderMain();
    }

    function setLayoutMode(mode) {
      state.viewLayoutMode = mode;
      localStorage.setItem('teacher_preferred_layout', mode);
      renderMain();
    }

    function renderMain() {
      var main = document.getElementById('mainContent');
      if (!main) return;

      if (state.teacherTab === 'list') {
        renderListView(main);
      } else {
        main.innerHTML = '<section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200"><h3 class="text-lg font-bold text-slate-900">' + state.teacherTab.toUpperCase() + ' 모듈</h3><p class="text-xs text-slate-500 mt-2">정상 가동 준비 완료되었습니다.</p></section>';
      }
    }

    function renderListView(container) {
      var now = new Date();
      var todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

      var filtered = state.regs.filter(function(r) {
        if (state.isTodayOnly && r.date !== todayStr) return false;
        if (state.dateFilter && r.date !== state.dateFilter) return false;
        if (!state.searchKeyword) return true;
        var kw = state.searchKeyword.toLowerCase();
        return (r.name || '').toLowerCase().includes(kw) || (r.univ || '').toLowerCase().includes(kw) || (r.dept || '').toLowerCase().includes(kw) || (r.num || '').includes(kw);
      });

      var uniqueDates = Array.from(new Set(state.regs.map(function(r) { return r.date; }))).sort();
      var dateOptions = uniqueDates.map(function(d) {
        return '<option value="' + d + '" ' + (state.dateFilter === d ? 'selected' : '') + '>' + d + '</option>';
      }).join('');

      var contentHtml = '';

      if (state.viewLayoutMode === '2') { // 2열 격자 카드
        var cards = filtered.map(function(r) {
          var isToday = r.date === todayStr;
          return '<div class="bg-white rounded-2xl p-4 shadow-sm border ' + (isToday ? 'border-2 border-brand-orange bg-amber-50/20' : 'border-slate-200') + ' space-y-3">' +
                 '<div class="flex justify-between items-start border-b pb-2">' +
                 '<div><span class="font-black text-brand-purple text-sm">[' + r.period + '교시]</span> <span class="font-extrabold text-slate-900 text-base">' + r.name + '</span> <span class="text-xs text-slate-500">(' + r.num + ')</span>' +
                 '<p class="text-xs font-bold text-slate-700 mt-1"><i class="fa-solid fa-calendar mr-1 text-slate-400"></i>' + r.date + '</p></div>' +
                 '<span class="px-2.5 py-1 rounded-full font-bold text-xs bg-slate-100 text-slate-700">' + (r.status || '대기') + '</span></div>' +
                 '<div class="space-y-1 text-xs"><p class="font-bold text-slate-900"><i class="fa-solid fa-graduation-cap text-brand-purple mr-1"></i>지원: ' + r.univ + ' ' + r.dept + '</p>' +
                 '<p class="text-slate-500">담당: [A] ' + (r.teacher1 || '미배정') + ' / [B] ' + (r.teacher2 || '미배정') + '</p></div>' +
                 '<div class="pt-2 border-t flex justify-between items-center"><span class="text-xs text-brand-purple font-bold">장소: ' + (r.location || '3학년 교무실') + '</span>' +
                 '<button onclick="alert(\'학생명: ' + r.name + '\')" class="bg-brand-purple text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm">상세보기</button></div>' +
                 '</div>';
        }).join('');

        contentHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' + (cards || '<div class="col-span-2 text-center py-12 text-slate-400 text-xs">신청 내역이 없습니다.</div>') + '</div>';
      } else {
        var rows = filtered.map(function(r, idx) {
          return '<tr class="border-b border-slate-100 hover:bg-slate-50 text-xs text-slate-700">' +
                 '<td class="py-3 px-2 text-center text-slate-400">' + (idx + 1) + '</td>' +
                 '<td class="py-3 px-2 font-bold text-brand-navy">' + r.date + ' [' + r.period + '교시]</td>' +
                 '<td class="py-3 px-2 font-bold text-slate-900">' + r.name + ' (' + r.num + ')</td>' +
                 '<td class="py-3 px-2 text-brand-purple font-semibold">' + r.univ + ' ' + r.dept + '</td>' +
                 '<td class="py-3 px-2 text-center text-slate-500">[A] ' + (r.teacher1 || '-') + ' / [B] ' + (r.teacher2 || '-') + '</td>' +
                 '<td class="py-3 px-2 text-center"><span class="px-2 py-1 rounded-full font-bold text-[10px] bg-slate-100">' + (r.status || '대기') + '</span></td>' +
                 '</tr>';
        }).join('');

        contentHtml = '<div class="w-full rounded-xl border border-slate-200 overflow-x-auto"><table class="w-full text-left border-collapse min-w-[650px]"><thead class="bg-slate-100 text-slate-600 text-xs font-bold border-b border-slate-200"><tr><th class="py-2.5 px-2 text-center w-12">No</th><th class="py-2.5 px-2">면접일시</th><th class="py-2.5 px-2">학생명 (학번)</th><th class="py-2.5 px-2">지원 대학교 · 학과</th><th class="py-2.5 px-2 text-center">담당 면접관</th><th class="py-2.5 px-2 text-center">상태</th></tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="py-8 text-center text-xs text-slate-400">신청 내역이 없습니다.</td></tr>') + '</tbody></table></div>';
      }

      container.innerHTML = 
        '<section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">' +
        '<div class="flex justify-between items-center border-b pb-4 flex-wrap gap-3">' +
        '<div><h3 class="text-lg font-bold text-slate-900">면접 예약 현황 목록</h3><p class="text-xs text-slate-500 mt-0.5">실시간 면접 신청 현황 (총 ' + filtered.length + '건)</p></div>' +
        '</div>' +
        '<div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 flex-wrap gap-2">' +
        '<div class="flex items-center space-x-2 flex-1 max-w-sm"><i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i><input type="text" placeholder="이름, 대학명 검색..." value="' + state.searchKeyword + '" oninput="state.searchKeyword=this.value; renderMain();" class="w-full bg-transparent text-xs focus:outline-none"></div>' +
        '<div class="flex items-center space-x-2 flex-wrap">' +
        '<button onclick="state.isTodayOnly=!state.isTodayOnly; renderMain();" class="text-xs font-bold px-3 py-1.5 rounded-xl border transition-all ' + (state.isTodayOnly ? 'bg-brand-orange text-white border-brand-orange' : 'bg-white text-slate-700 border-slate-300') + '">📅 오늘 면접</button>' +
        '<select onchange="state.dateFilter=this.value; renderMain();" class="text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-300 bg-white"><option value="">🗓️ 전체 날짜</option>' + dateOptions + '</select>' +
        '<div class="flex bg-white p-0.5 rounded-xl border border-slate-300">' +
        '<button onclick="setLayoutMode(\'1\')" class="px-2 py-1 text-xs font-bold rounded-lg ' + (state.viewLayoutMode === '1' ? 'bg-brand-purple text-white' : 'text-slate-600') + '">슬림표</button>' +
        '<button onclick="setLayoutMode(\'2\')" class="px-2 py-1 text-xs font-bold rounded-lg ' + (state.viewLayoutMode === '2' ? 'bg-brand-purple text-white' : 'text-slate-600') + '">격자카드</button>' +
        '</div>' +
        '</div>' +
        '</div>' +
        contentHtml +
        '</section>';
    }

    // 접속 직후 즉시 실행
    renderMain();
  </script>
</body>
</html>
