  <script>
    var STUDENT_LIST = JSON.parse(localStorage.getItem('mock_student_list') || '[]');

    var DEFAULT_TEACHER_A = ["최명호", "전명치", "백홍", "엄혜진", "정해린"];
    var DEFAULT_TEACHER_B = ["원선보", "이나경", "조아영", "이진경", "김준형", "신이현"];

    var TEACHER_A_GROUP = JSON.parse(localStorage.getItem('mock_teacher_a_group') || JSON.stringify(DEFAULT_TEACHER_A));
    var TEACHER_B_GROUP = JSON.parse(localStorage.getItem('mock_teacher_b_group') || JSON.stringify(DEFAULT_TEACHER_B));
    var ALL_TEACHERS = Array.from(new Set([...TEACHER_A_GROUP, ...TEACHER_B_GROUP]));

    var ADMIN_PASSWORD = localStorage.getItem('mock_admin_password') || '01054568795';

    var TEACHER_SCHEDULE = JSON.parse(localStorage.getItem('mock_teacher_schedule') || JSON.stringify({}));
    
    // ★ [날짜별 수동 지정 정원 저장소 추가] ★
    var CUSTOM_CAPACITIES = JSON.parse(localStorage.getItem('mock_custom_capacities') || '{}');

    var DEFAULT_CLOSED_DATES = ["2026-10-05", "2026-10-09"];

    var state = {
      year: 2026,
      month: 10,
      teacherTab: 'list',
      editingTeacherId: null,
      selectedTeacherDates: [],
      searchKeyword: '',
      evalSearchKeyword: '',
      realReviewKeyword: '',
      dateFilter: '',
      isTodayOnly: false,
      viewLayoutMode: localStorage.getItem('teacher_preferred_layout') || '0',
      expandedRowIds: [],
      closedDates: JSON.parse(localStorage.getItem('mock_closed_dates') || JSON.stringify(DEFAULT_CLOSED_DATES)),
      regs: JSON.parse(localStorage.getItem('mock_regs') || '[]'),
      realReviews: JSON.parse(localStorage.getItem('mock_real_reviews') || '[]')
    };

    document.addEventListener('DOMContentLoaded', function() {
      try {
        updateSidebarNavForTeacher();
        renderTeacherView();
        syncDatabase();
      } catch(err) {
        console.error("DOM Init Error", err);
      }
    });

    function goToStudentPage() {
      window.location.href = './index.html';
    }

    function changeViewLayoutMode(modeVal) {
      state.viewLayoutMode = modeVal;
      localStorage.setItem('teacher_preferred_layout', modeVal);
      renderTeacherListView();
    }

    function toggleRowExpansion(id) {
      if (state.expandedRowIds.includes(id)) {
        state.expandedRowIds = state.expandedRowIds.filter(function(item) { return item !== id; });
      } else {
        state.expandedRowIds.push(id);
      }
      renderTeacherListView();
    }

    function updateSidebarNavForTeacher() {
      var nav = document.getElementById('sidebarNav');
      if (!nav) return;
      nav.innerHTML = `
        <button onclick="switchTeacherTab('calendar')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'calendar' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-calendar-days mr-2"></i>달력 일정 및 마감 관리</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('schedule')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'schedule' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-user-gear mr-2"></i>날짜별 참여 교사 관리</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('list')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'list' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-list-check mr-2"></i>면접 예약 현황 목록</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('evals')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'evals' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-file-signature mr-2 text-indigo-600"></i>학생 면접 평가지 관리</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('realReviews')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'realReviews' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-book-bookmark mr-2 text-brand-orange"></i>실제 면접 후기 DB</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('stats')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'stats' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-chart-pie mr-2"></i>면접교사 배정 통계</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('admin')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'admin' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-user-shield mr-2"></i>교사 관리자 전용</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="goToStudentPage()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold transition-all mt-3 pt-3 border-t whitespace-nowrap">
          <span><i class="fa-solid fa-user-graduate mr-2 text-brand-purple"></i>학생 사이트로 이동</span>
          <i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>
        </button>
      `;
    }

    function switchTeacherTab(tabName) {
      if (tabName === 'admin') {
        var inputPwd = prompt('관리자 전용 비밀번호를 입력해 주세요:');
        if (inputPwd !== ADMIN_PASSWORD) {
          alert('비밀번호가 올바르지 않습니다.');
          return;
        }
      }
      state.teacherTab = tabName;
      updateSidebarNavForTeacher();
      renderTeacherView();
    }

    function syncDatabase() {
      if (window.isFirebaseReady && window.dbTools) {
        try {
          var collection = window.dbTools.collection;
          var onSnapshot = window.dbTools.onSnapshot;
          
          onSnapshot(collection(window.db, 'interview_registrations'), function(snapshot) {
            state.regs = [];
            snapshot.forEach(function(doc) { state.regs.push(doc.data()); });
            localStorage.setItem('mock_regs', JSON.stringify(state.regs));
            renderTeacherView();
          });

          onSnapshot(collection(window.db, 'interview_settings'), function(snapshot) {
            snapshot.forEach(function(doc) {
              if (doc.id === 'custom_capacities') {
                CUSTOM_CAPACITIES = doc.data().capacities || {};
                localStorage.setItem('mock_custom_capacities', JSON.stringify(CUSTOM_CAPACITIES));
              }
            });
          });
        } catch(e) { console.warn("Firestore Listener Error", e); }
      }
    }

    function getMaxTeamsForDateAndPeriod(dateStr, periodNum) {
      if (CUSTOM_CAPACITIES[dateStr] && CUSTOM_CAPACITIES[dateStr][periodNum] !== undefined) {
        return Number(CUSTOM_CAPACITIES[dateStr][periodNum]);
      }
      
      var availList = TEACHER_SCHEDULE[dateStr] || [];
      var countA = availList.filter(t => TEACHER_A_GROUP.includes(t)).length;
      var countB = availList.filter(t => TEACHER_B_GROUP.includes(t)).length;

      var standardPairs = Math.min(countA, countB);
      var remA = countA - standardPairs;
      var extraSeniorPairs = Math.floor(remA / 2);

      return standardPairs + extraSeniorPairs;
    }

    function saveCustomCapacity(dateStr) {
      var p8Val = document.getElementById('cap_p8_' + dateStr)?.value;
      var p9Val = document.getElementById('cap_p9_' + dateStr)?.value;
      var p10Val = document.getElementById('cap_p10_' + dateStr)?.value;

      if (!CUSTOM_CAPACITIES[dateStr]) CUSTOM_CAPACITIES[dateStr] = {};

      if (p8Val !== undefined && p8Val !== '') CUSTOM_CAPACITIES[dateStr][8] = Number(p8Val);
      if (p9Val !== undefined && p9Val !== '') CUSTOM_CAPACITIES[dateStr][9] = Number(p9Val);
      if (p10Val !== undefined && p10Val !== '') CUSTOM_CAPACITIES[dateStr][10] = Number(p10Val);

      localStorage.setItem('mock_custom_capacities', JSON.stringify(CUSTOM_CAPACITIES));

      if (window.isFirebaseReady && window.dbTools) {
        try {
          var doc = window.dbTools.doc;
          var setDoc = window.dbTools.setDoc;
          setDoc(doc(window.db, 'interview_settings', 'custom_capacities'), { capacities: CUSTOM_CAPACITIES });
        } catch(e) {}
      }

      alert('[' + dateStr + '] 수동 지정 정원이 저장되었습니다!');
      showTeacherDateDetail(dateStr);
    }

    function renderTeacherView() {
      if (state.teacherTab === 'calendar') {
        renderTeacherCalendarView();
      } else if (state.teacherTab === 'stats') {
        renderTeacherStatsView();
      } else if (state.teacherTab === 'schedule') {
        renderTeacherScheduleView();
      } else if (state.teacherTab === 'admin') {
        renderTeacherAdminView();
      } else if (state.teacherTab === 'evals') {
        renderTeacherEvalsView();
      } else if (state.teacherTab === 'realReviews') {
        renderTeacherRealReviewsView();
      } else {
        renderTeacherListView();
      }
    }

    function renderTeacherListView() {
      var main = document.getElementById('mainContent');
      if (!main) return;

      var uniqueDates = Array.from(new Set(state.regs.map(function(r) { return r.date; }))).sort();
      var dateSelectOptions = uniqueDates.map(function(d) {
        return `<option value="${d}" ${state.dateFilter === d ? 'selected' : ''}>${d}</option>`;
      }).join('');

      var now = new Date();
      var todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      var todayRegsCount = state.regs.filter(function(r) { return r.date === todayStr; }).length;

      var filteredRegs = state.regs.filter(function(r) {
        if (state.isTodayOnly && r.date !== todayStr) return false;
        if (state.dateFilter && r.date !== state.dateFilter) return false;

        if (!state.searchKeyword) return true;
        var kw = state.searchKeyword.toLowerCase();
        return (r.name || '').toLowerCase().includes(kw) ||
               (r.univ || '').toLowerCase().includes(kw) ||
               (r.dept || '').toLowerCase().includes(kw) ||
               (r.num || '').includes(kw);
      });

      var contentLayoutHtml = '';

      if (state.viewLayoutMode === '0') {
        var tableRows = filteredRegs.map(function(r, idx) {
          var isEditing = state.editingTeacherId === r.id || (!r.teacher1 && !r.teacher2);
          var availList = TEACHER_SCHEDULE[r.date] || ALL_TEACHERS;

          var availA = availList.filter(function(t) { return TEACHER_A_GROUP.includes(t); });
          var availB = availList.filter(function(t) { return TEACHER_B_GROUP.includes(t); });

          var teacherCellHtml = '';
          if (isEditing) {
            var t1Options = availA.map(function(t) { return `<option value="${t}" ${r.teacher1 === t ? 'selected' : ''}>${t}</option>`; }).join('');
            var t2Options = availB.map(function(t) { return `<option value="${t}" ${r.teacher2 === t ? 'selected' : ''}>${t}</option>`; }).join('');
            teacherCellHtml = `<div class="flex items-center justify-center space-x-0.5 whitespace-nowrap"><select id="t1Input_${r.id}" class="w-16 px-1 py-0.5 text-[10px] border rounded bg-white"><option value="">A교사</option>${t1Options}</select> <select id="t2Input_${r.id}" class="w-16 px-1 py-0.5 text-[10px] border rounded bg-white"><option value="">B교사</option>${t2Options}</select> <button onclick="saveTeachers('${r.id}')" class="bg-brand-purple text-white px-1.5 py-0.5 rounded text-[10px] font-bold">저장</button></div>`;
          } else {
            teacherCellHtml = `<div class="flex items-center justify-center space-x-1 whitespace-nowrap">${r.teacher1 ? `<span class="bg-amber-100 text-amber-800 px-1 py-0.5 rounded font-bold text-[10px]">${r.teacher1}</span>` : ''} ${r.teacher2 ? `<span class="bg-blue-100 text-blue-800 px-1 py-0.5 rounded font-bold text-[10px]">${r.teacher2}</span>` : ''} <button onclick="enableTeacherEdit('${r.id}')" class="text-slate-400 hover:text-brand-purple text-[10px] underline ml-0.5">수정</button></div>`;
          }

          var statusStyle = r.status === '완료' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : r.status === '불참' ? 'bg-red-100 text-red-800 border-red-300' : 'bg-slate-100 text-slate-700 border-slate-300';
          var preQCount = (r.preQuestions || []).length;
          var isTodayRow = r.date === todayStr;

          return `
            <tr class="border-b border-slate-100 hover:bg-slate-50 text-[11px] text-slate-700 ${isTodayRow ? 'bg-amber-50/30 font-semibold' : ''}">
              <td class="py-2.5 px-2 font-semibold text-slate-500 text-center whitespace-nowrap">${idx + 1}</td>
              <td class="py-2.5 px-2 font-bold ${isTodayRow ? 'text-brand-orange' : 'text-brand-navy'} text-center whitespace-nowrap">${r.date} ${isTodayRow ? '⭐' : ''}</td>
              <td class="py-2.5 px-2 font-bold text-brand-purple text-center whitespace-nowrap">${r.period}교시</td>
              <td class="py-2.5 px-2 font-semibold text-center whitespace-nowrap">${r.num}</td>
              <td class="py-2.5 px-2 font-bold text-slate-900 text-center whitespace-nowrap">${r.name}</td>
              <td class="py-2.5 px-2 text-center truncate max-w-[85px]" title="${r.univ}">${r.univ}</td>
              <td class="py-2.5 px-2 text-center truncate max-w-[85px]" title="${r.dept}">${r.dept}</td>
              <td class="py-2.5 px-2 text-center truncate max-w-[65px] text-slate-500" title="${r.note || '-'}">${r.note || '-'}</td>
              <td class="py-2.5 px-2 text-center whitespace-nowrap">
                <button onclick="toggleStudentStatus('${r.id}')" class="px-2 py-0.5 rounded-full font-bold text-[10px] border transition-all ${statusStyle} whitespace-nowrap">${r.status || '대기'}</button>
              </td>
              <td class="py-2.5 px-2 text-center whitespace-nowrap">
                <div class="flex items-center justify-center space-x-1">
                  <button onclick="openPreQuestionsModal('${r.id}')" class="bg-amber-50 hover:bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold border border-amber-200 text-[10px] whitespace-nowrap">❓질문(${preQCount})</button>
                  <button onclick="printSingleStudentPreQuestions('${r.id}')" class="text-indigo-600 hover:text-indigo-800 text-[10px] font-bold underline" title="질문지 인쇄">🖨️</button>
                </div>
              </td>
              <td class="py-2.5 px-2 text-center whitespace-nowrap">${teacherCellHtml}</td>
              <td class="py-2.5 px-2 text-center whitespace-nowrap">
                <input type="text" value="${r.location || '3학년 교무실'}" onchange="updateLocation('${r.id}', this.value)" class="w-24 px-1.5 py-0.5 text-[10px] text-center border border-slate-200 rounded focus:border-brand-purple">
              </td>
              <td class="py-2.5 px-3 text-center whitespace-nowrap min-w-[110px]">
                <div class="flex items-center justify-center space-x-1.5">
                  <button onclick="openOnlineEvalModal('${r.id}')" class="bg-brand-purple text-white hover:bg-brand-purple/90 px-2 py-1 rounded-lg text-[10px] font-bold shadow-sm whitespace-nowrap">📝 평가지</button>
                  <button onclick="deleteRegistration('${r.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-2 py-1 rounded-lg text-[10px] font-bold shadow-sm transition-all whitespace-nowrap">삭제</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        contentLayoutHtml = `
          <div class="w-full rounded-xl border border-slate-200 overflow-x-auto custom-scroll">
            <table class="w-full text-left border-collapse min-w-[1050px]">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-600">
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">No</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">희망일</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">교시</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">학번</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">이름</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">지원 대학교</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">지원 학과</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">요청사항</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">상태</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">사전질문</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">담당 교사(A/B)</th>
                  <th class="py-2.5 px-2 text-center whitespace-nowrap">면접 장소</th>
                  <th class="py-2.5 px-3 text-center whitespace-nowrap">관리</th>
                </tr>
              </thead>
              <tbody>
                ${tableRows.length > 0 ? tableRows : '<tr><td colspan="13" class="py-8 text-center text-xs text-slate-400">신청 내역이 없습니다.</td></tr>'}
              </tbody>
            </table>
          </div>
        `;
      }

      main.innerHTML = `
        <section class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 space-y-4 sm:space-y-5">
          <div class="flex justify-between items-center border-b border-slate-100 pb-3.5 flex-wrap gap-2 sm:gap-3">
            <div>
              <h3 class="text-base sm:text-lg font-bold text-slate-900 whitespace-nowrap">면접 예약 현황 및 온라인 직접 평가</h3>
              <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 whitespace-nowrap">실시간 면접 신청 현황 및 현장 평가 입력 (총 ${filteredRegs.length}건)</p>
            </div>
            <div class="flex items-center space-x-1.5 flex-wrap gap-1.5">
              <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl font-bold shadow-sm transition-all whitespace-nowrap">
                <i class="fa-solid fa-file-excel mr-1"></i> 엑셀
              </button>
            </div>
          </div>

          <div class="flex justify-between items-center bg-slate-50 p-2.5 sm:p-3 rounded-xl border border-slate-200 flex-wrap gap-2">
            <div class="flex items-center space-x-2 w-full sm:w-auto flex-1 max-w-xs sm:max-w-sm">
              <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
              <input type="text" id="teacherSearchInput" placeholder="대학명, 학과, 이름으로 검색..." value="${state.searchKeyword}" oninput="handleTeacherSearch(this.value)" class="w-full bg-transparent text-xs focus:outline-none">
            </div>

            <div class="flex items-center space-x-2 flex-wrap gap-1.5">
              <button onclick="toggleTodayOnlyFilter()" class="text-xs font-bold px-3 py-1.5 rounded-xl border transition-all whitespace-nowrap ${state.isTodayOnly ? 'bg-brand-orange text-white border-brand-orange shadow-sm ring-2 ring-brand-orange/30' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}">
                📅 오늘 면접 (${todayRegsCount}명) ${state.isTodayOnly ? '✓' : ''}
              </button>

              <select onchange="handleDateFilterChange(this.value)" class="text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-300 bg-white text-slate-700 focus:outline-none focus:border-brand-purple">
                <option value="">🗓️ 전체 날짜 보기</option>
                ${dateSelectOptions}
              </select>

              <span class="text-xs text-slate-500 whitespace-nowrap pl-1" id="teacherSearchResultCount">결과: <strong>${filteredRegs.length}건</strong></span>
            </div>
          </div>

          ${contentLayoutHtml}
        </section>
      `;
    }

    function showTeacherDateDetail(dateStr) {
      var container = document.getElementById('teacherCalDetail');
      if (!container) return;

      var isClosed = state.closedDates.includes(dateStr);
      var dayRegs = state.regs.filter(r => r.date === dateStr);
      var availTeachers = TEACHER_SCHEDULE[dateStr] || [];

      var c8 = getMaxTeamsForDateAndPeriod(dateStr, 8);
      var c9 = getMaxTeamsForDateAndPeriod(dateStr, 9);
      var c10 = getMaxTeamsForDateAndPeriod(dateStr, 10);

      container.classList.remove('hidden');
      container.innerHTML = `
        <div class="space-y-3 bg-brand-purpleLight/40 p-4 rounded-xl border border-brand-purple/20">
          <div class="flex justify-between items-center flex-wrap gap-2">
            <h4 class="font-bold text-slate-900 text-sm">📅 ${dateStr} 정원 수동 설정 및 운영 관리</h4>
            <span class="text-xs text-slate-600">가능 교사: <strong>${availTeachers.join(', ') || '없음'}</strong></span>
          </div>

          <div class="bg-white p-3 rounded-lg border border-purple-200 flex items-center space-x-4 text-xs font-semibold flex-wrap gap-2">
            <span class="text-brand-purple font-bold">⚙️ 교시별 수동 정원 지정:</span>
            <div class="flex items-center space-x-1">
              <span>8교시:</span>
              <input type="number" id="cap_p8_${dateStr}" value="${c8}" min="0" max="20" class="w-12 px-1 py-0.5 border rounded text-center">명
            </div>
            <div class="flex items-center space-x-1">
              <span>9교시:</span>
              <input type="number" id="cap_p9_${dateStr}" value="${c9}" min="0" max="20" class="w-12 px-1 py-0.5 border rounded text-center">명
            </div>
            <div class="flex items-center space-x-1">
              <span>10교시:</span>
              <input type="number" id="cap_p10_${dateStr}" value="${c10}" min="0" max="20" class="w-12 px-1 py-0.5 border rounded text-center">명
            </div>
            <button onclick="saveCustomCapacity('${dateStr}')" class="bg-brand-purple text-white px-3 py-1 rounded-lg text-xs font-bold shadow-sm">
              💾 정원 지정 저장
            </button>
          </div>
        </div>
      `;
    }

    function renderTeacherCalendarView() {
      var main = document.getElementById('mainContent');
      if (!main) return;

      var firstDay = new Date(state.year, state.month - 1, 1).getDay();
      var lastDate = new Date(state.year, state.month, 0).getDate();

      var now = new Date();
      var todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      var calGridHtml = '';
      for (var i = 0; i < firstDay; i++) {
        calGridHtml += `<div class="h-24 sm:h-28 bg-slate-50/50 rounded-xl"></div>`;
      }

      for (var d = 1; d <= lastDate; d++) {
        var dateStr = `${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        
        var isClosed = state.closedDates.includes(dateStr);
        var isChecked = state.selectedTeacherDates.includes(dateStr);
        var isToday = dateStr === todayStr;
        var dayRegs = state.regs.filter(function(r) { return r.date === dateStr; });

        calGridHtml += `
          <div onclick="showTeacherDateDetail('${dateStr}')" class="h-24 border bg-white rounded-xl p-2 cursor-pointer flex flex-col justify-between hover:border-brand-purple">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold">${d}일</span>
              <span class="text-[9px] text-slate-500 font-bold">${dayRegs.length}건</span>
            </div>
          </div>
        `;
      }

      main.innerHTML = `
        <section class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 space-y-4 sm:space-y-5">
          <div class="flex justify-between items-center border-b border-slate-100 pb-3.5">
            <h3 class="text-base sm:text-lg font-bold text-slate-900">📅 달력 일정 및 마감 관리</h3>
          </div>
          <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-xs font-bold text-slate-500 py-1.5 border-b border-slate-100">
            <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
          </div>
          <div class="grid grid-cols-7 gap-1 sm:gap-2">${calGridHtml}</div>
          <div id="teacherCalDetail" class="hidden border-t pt-4 space-y-3"></div>
        </section>
      `;
    }

    function renderTeacherScheduleView() {}
    function renderTeacherEvalsView() {}
    function renderTeacherRealReviewsView() {}
    function renderTeacherAdminView() {}
    function renderTeacherStatsView() {}
    function toggleTodayOnlyFilter() { state.isTodayOnly = !state.isTodayOnly; renderTeacherListView(); }
    function handleDateFilterChange(val) { state.dateFilter = val; renderTeacherListView(); }
    function handleTeacherSearch(value) { state.searchKeyword = value; renderTeacherListView(); }
    function openOnlineEvalModal() {}
    function closeOnlineEvalModal() { document.getElementById('onlineEvalModal').classList.add('hidden'); }
    function openPreQuestionsModal() {}
    function closePreQuestionsModal() { document.getElementById('preQuestionsModal').classList.add('hidden'); }
    function enableTeacherEdit(id) { state.editingTeacherId = id; renderTeacherListView(); }
    function saveTeachers(id) { state.editingTeacherId = null; renderTeacherListView(); }
    function toggleStudentStatus(id) { renderTeacherListView(); }
    function deleteRegistration(id) { renderTeacherListView(); }
    function updateLocation() {}
  </script>
</body>
</html>
