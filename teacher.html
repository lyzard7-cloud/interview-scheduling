<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강일여자고등학교 3학년부 - 대입 면접 교사 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    @font-face {
      font-family: 'BMJUA';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    .font-jua { font-family: 'BMJUA', 'Pretendard', sans-serif; }
    .custom-scroll::-webkit-scrollbar { height: 4px; width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <header class="bg-[#1e1e2d] text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center text-xs border-b border-slate-700">
      <div class="flex items-center space-x-3 text-slate-300">
        <span class="font-bold text-white"><i class="fa-solid fa-school text-[#ff7a00]"></i> 강일여고 3학년부</span>
        <span>|</span>
        <span>2026 수시 맞춤형 면접 (교사 전용)</span>
      </div>
    </div>
    
    <div class="max-w-7xl mx-auto px-4 py-5 flex justify-between items-center">
      <h1 class="text-2xl font-extrabold text-white font-jua">강일여고 교사용 면접 관리 시스템</h1>
      <div class="text-xs text-slate-300 bg-slate-800 px-4 py-2 rounded-full border border-slate-700 flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-yellow-400"></span>
        <span class="text-[#ff7a00] font-bold"><i class="fa-solid fa-user-shield"></i> 교사 관리자 접속됨</span>
      </div>
    </div>
  </header>

  <div class="max-w-7xl w-full mx-auto px-4 py-6 flex-1 flex flex-col md:flex-row gap-6">
    <aside class="w-full md:w-64 shrink-0 space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <div class="bg-[#7c3aed] text-white p-3 rounded-xl font-bold text-sm flex justify-between items-center">
          <span>교사 관리 포털</span>
          <i class="fa-solid fa-bars"></i>
        </div>
        <nav class="space-y-1 text-xs sm:text-sm font-medium pt-3" id="sidebarNav">
          <button onclick="switchTab('list')" id="btn_list" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg bg-[#f3e8ff] text-[#7c3aed] font-bold mb-1">
            <span><i class="fa-solid fa-list-check mr-2"></i>면접 예약 현황 목록</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('calendar')" id="btn_calendar" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-calendar-days mr-2"></i>달력 일정 및 마감 관리</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('schedule')" id="btn_schedule" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-user-gear mr-2"></i>날짜별 참여 교사 관리</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('evals')" id="btn_evals" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-file-signature mr-2 text-indigo-600"></i>학생 면접 평가지 관리</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('realReviews')" id="btn_realReviews" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-book-bookmark mr-2 text-[#ff7a00]"></i>실제 면접 후기 DB</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('stats')" id="btn_stats" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-chart-pie mr-2"></i>면접교사 배정 통계</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="switchTab('admin')" id="btn_admin" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1">
            <span><i class="fa-solid fa-user-shield mr-2"></i>교사 관리자 전용</span>
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <a href="./index.html" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold mt-3 pt-3 border-t">
            <span><i class="fa-solid fa-user-graduate mr-2 text-[#7c3aed]"></i>학생 사이트로 이동</span>
            <i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>
          </a>
        </nav>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 text-xs space-y-1">
        <p class="font-bold text-slate-800"><i class="fa-solid fa-headset text-[#7c3aed] mr-1"></i> 시스템 문의</p>
        <p class="text-slate-500">3학년 교무실</p>
        <p class="text-slate-700 font-semibold">033-650-0783 (내선 783)</p>
      </div>
    </aside>

    <main class="flex-1 space-y-6 min-w-0" id="mainContent">
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
        <div class="flex justify-between items-center border-b pb-4 flex-wrap gap-3">
          <div>
            <h3 class="text-lg font-bold text-slate-900">면접 예약 현황 목록 (옛날 원본 표)</h3>
            <p class="text-xs text-slate-500 mt-0.5" id="totalCountText">실시간 면접 신청 현황</p>
          </div>
        </div>

        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 flex-wrap gap-2">
          <div class="flex items-center space-x-2 flex-1 max-w-sm">
            <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" oninput="renderTable()" placeholder="이름, 대학명, 학과 검색..." class="w-full bg-transparent text-xs focus:outline-none">
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="toggleToday()" id="todayBtn" class="text-xs font-bold px-3 py-1.5 rounded-xl border bg-white border-slate-300">📅 오늘 면접</button>
            <select id="dateSelect" onchange="renderTable()" class="text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-300 bg-white">
              <option value="">🗓️ 전체 날짜</option>
            </select>
          </div>
        </div>

        <!-- 13열 원본 전체 표 -->
        <div class="w-full rounded-xl border border-slate-200 overflow-x-auto custom-scroll">
          <table class="w-full text-left border-collapse min-w-[1100px]">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-600">
                <th class="py-2.5 px-2 text-center whitespace-nowrap">No</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">희망일</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">교시</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">학번</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">이름</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">지원 대학교</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">지원 학과</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">요청사항</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">상태</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">사전질문</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">담당 교사(A/B)</th>
                <th class="py-2.5 px-2 text-center whitespace-nowrap">면접 장소</th>
                <th class="py-2.5 px-3 text-center whitespace-nowrap">관리</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    var currentTab = 'list';
    var isTodayOnly = false;
    var regs = JSON.parse(localStorage.getItem('mock_regs') || '[]');

    function switchTab(tab) {
      currentTab = tab;
      var tabs = ['list', 'calendar', 'schedule', 'evals', 'realReviews', 'stats', 'admin'];
      tabs.forEach(function(t) {
        var btn = document.getElementById('btn_' + t);
        if (btn) {
          if (t === tab) {
            btn.className = "w-full flex items-center justify-between px-3 py-2.5 rounded-lg bg-[#f3e8ff] text-[#7c3aed] font-bold mb-1";
          } else {
            btn.className = "w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 mb-1";
          }
        }
      });

      var main = document.getElementById('mainContent');
      if (tab === 'list') {
        location.reload();
      } else {
        main.innerHTML = '<section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200"><h3 class="text-lg font-bold text-slate-900">' + tab.toUpperCase() + ' 기능 화면</h3><p class="text-xs text-slate-500 mt-2">정상 가동 중입니다.</p></section>';
      }
    }

    function toggleToday() {
      isTodayOnly = !isTodayOnly;
      var btn = document.getElementById('todayBtn');
      if (isTodayOnly) {
        btn.className = "text-xs font-bold px-3 py-1.5 rounded-xl border bg-[#ff7a00] text-white border-[#ff7a00]";
      } else {
        btn.className = "text-xs font-bold px-3 py-1.5 rounded-xl border bg-white border-slate-300";
      }
      renderTable();
    }

    function renderTable() {
      var tbody = document.getElementById('tableBody');
      var kw = (document.getElementById('searchInput')?.value || '').toLowerCase();
      var dateVal = document.getElementById('dateSelect')?.value || '';

      var now = new Date();
      var todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

      var filtered = regs.filter(function(r) {
        if (isTodayOnly && r.date !== todayStr) return false;
        if (dateVal && r.date !== dateVal) return false;
        if (kw) {
          return (r.name || '').toLowerCase().includes(kw) || (r.univ || '').toLowerCase().includes(kw) || (r.dept || '').toLowerCase().includes(kw) || (r.num || '').includes(kw);
        }
        return true;
      });

      var countText = document.getElementById('totalCountText');
      if (countText) countText.textContent = "실시간 면접 신청 현황 (총 " + filtered.length + "건)";

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="13" class="py-8 text-center text-xs text-slate-400">신청 내역이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(function(r, idx) {
        return '<tr class="border-b border-slate-100 hover:bg-slate-50 text-[11px] text-slate-700">' +
               '<td class="py-2.5 px-2 text-center text-slate-400">' + (idx + 1) + '</td>' +
               '<td class="py-2.5 px-2 font-bold text-[#1e1e2d] text-center">' + r.date + '</td>' +
               '<td class="py-2.5 px-2 font-bold text-[#7c3aed] text-center">' + r.period + '교시</td>' +
               '<td class="py-2.5 px-2 text-center">' + r.num + '</td>' +
               '<td class="py-2.5 px-2 font-bold text-slate-900 text-center">' + r.name + '</td>' +
               '<td class="py-2.5 px-2 text-center">' + r.univ + '</td>' +
               '<td class="py-2.5 px-2 text-center">' + r.dept + '</td>' +
               '<td class="py-2.5 px-2 text-center text-slate-500">' + (r.note || '-') + '</td>' +
               '<td class="py-2.5 px-2 text-center"><span class="px-2 py-0.5 rounded-full font-bold text-[10px] bg-slate-100">' + (r.status || '대기') + '</span></td>' +
               '<td class="py-2.5 px-2 text-center"><span class="bg-amber-50 text-amber-800 px-1.5 py-0.5 rounded font-bold border border-amber-200 text-[10px]">❓질문(' + (r.preQuestions || []).length + ')</span></td>' +
               '<td class="py-2.5 px-2 text-center"><span class="bg-amber-100 text-amber-800 px-1 py-0.5 rounded font-bold text-[10px]">' + (r.teacher1 || '미배정') + '</span> <span class="bg-blue-100 text-blue-800 px-1 py-0.5 rounded font-bold text-[10px]">' + (r.teacher2 || '미배정') + '</span></td>' +
               '<td class="py-2.5 px-2 text-center">' + (r.location || '3학년 교무실') + '</td>' +
               '<td class="py-2.5 px-3 text-center whitespace-nowrap"><button onclick="alert(\'선택 학생: ' + r.name + '\')" class="bg-[#7c3aed] text-white px-2 py-1 rounded text-[10px] font-bold">📝 평가지</button> <button onclick="alert(\'취소 클릭\')" class="bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded text-[10px] font-bold">삭제</button></td>' +
               '</tr>';
      }).join('');
    }

    // 날짜 드롭다운 채우기
    var dates = Array.from(new Set(regs.map(function(r) { return r.date; }))).sort();
    var select = document.getElementById('dateSelect');
    if (select) {
      dates.forEach(function(d) {
        var opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        select.appendChild(opt);
      });
    }

    // 실행
    renderTable();
  </script>
</body>
</html>
