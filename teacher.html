  <script>

      "2026-10-12": ["신이현", "이진경", "백홍", "이나경", "정해린"],
      "2026-10-13": ["신이현", "조아영", "정해린", "최명호", "전명치"],
      "2026-10-14": ["원선보", "이진경", "백홍", "이나경", "조아영"],
      "2026-10-15": ["엄혜진", "원선보", "신이현", "정해린", "최명호", "전명치"],
      "2026-10-16": ["김준형", "엄혜진", "원선보", "신이현", "이진경", "백홍", "이나경", "조아영", "정해린"],
      "2026-10-19": ["신이현", "이진경", "백홍", "이나경", "정해린"],
      "2026-10-20": ["원선보", "신이현", "이진경", "백홍", "이나경", "조아영", "정해린", "최명호", "전명치"],
      "2026-10-21": ["원선보", "백홍", "이나경", "조아영"],
      "2026-10-22": ["엄혜진", "원선보", "신이현", "정해린", "최명호", "전명치"],
      "2026-10-23": ["김준형", "엄혜진", "원선보", "신이현", "이진경", "백홍", "이나경", "조아영", "정해린"],
      "2026-10-26": ["신이현", "백홍", "이나경", "정해린"],
      "2026-10-27": ["신이현", "이진경", "조아영", "정해린", "최명호", "전명치"],
      "2026-10-28": ["원선보", "이진경", "백홍", "이나경", "조아영", "전명치"],
      "2026-10-29": ["엄혜진", "원선보", "신이현", "정해린", "최명호", "전명치"],
      "2026-10-30": ["김준형", "엄혜진", "원선보", "신이현", "이진경", "백홍", "이나경", "조아영", "정해린", "전명치"]
    }));

    var DEFAULT_CLOSED_DATES = ["2026-10-05", "2026-10-09"];

    var state = {
      year: 2026,
      month: 10,
      teacherTab: 'list',
      editingTeacherId: null,
      selectedTeacherDates: [],
      searchKeyword: '',
      evalSearchKeyword: '',
      realReviewKeyword: '',
      dateFilter: '',
      isTodayOnly: false,
      // ★ 기본 보기 모드: 옛날 원본 13열 표 ('0') ★
      viewLayoutMode: localStorage.getItem('teacher_preferred_layout') || '0',
      expandedRowIds: [],
      closedDates: JSON.parse(localStorage.getItem('mock_closed_dates') || JSON.stringify(DEFAULT_CLOSED_DATES)),
      regs: JSON.parse(localStorage.getItem('mock_regs') || '[]'),
      realReviews: JSON.parse(localStorage.getItem('mock_real_reviews') || '[]')
    };

    document.addEventListener('DOMContentLoaded', function() {
      try {
        updateSidebarNavForTeacher();
        renderTeacherView();
        syncDatabase();
      } catch(err) {
        console.error("DOM Init Error Handled", err);
      }
    });

    function goToStudentPage() {
      window.location.href = './index.html';
    }

    function changeViewLayoutMode(modeVal) {
      state.viewLayoutMode = modeVal;
      localStorage.setItem('teacher_preferred_layout', modeVal);
      renderTeacherListView();
    }

    function toggleRowExpansion(id) {
      if (state.expandedRowIds.includes(id)) {
        state.expandedRowIds = state.expandedRowIds.filter(function(item) { return item !== id; });
      } else {
        state.expandedRowIds.push(id);
      }
      renderTeacherListView();
    }

    function updateSidebarNavForTeacher() {
      var nav = document.getElementById('sidebarNav');
      if (!nav) return;
      nav.innerHTML = `
        <button onclick="switchTeacherTab('calendar')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'calendar' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-calendar-days mr-2"></i>달력 일정 및 마감 관리</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('schedule')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'schedule' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-user-gear mr-2"></i>날짜별 참여 교사 관리</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('list')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'list' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-list-check mr-2"></i>면접 예약 현황 목록</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('evals')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'evals' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-file-signature mr-2 text-indigo-600"></i>학생 면접 평가지 관리</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('realReviews')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'realReviews' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-book-bookmark mr-2 text-brand-orange"></i>실제 면접 후기 DB</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('stats')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'stats' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-chart-pie mr-2"></i>면접교사 배정 통계</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="switchTeacherTab('admin')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg ${state.teacherTab === 'admin' ? 'bg-brand-purpleLight text-brand-purple font-bold' : 'text-slate-700 hover:bg-slate-100 font-medium'} transition-all mb-1 whitespace-nowrap">
          <span><i class="fa-solid fa-user-shield mr-2"></i>교사 관리자 전용</span>
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
        <button onclick="goToStudentPage()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold transition-all mt-3 pt-3 border-t whitespace-nowrap">
          <span><i class="fa-solid fa-user-graduate mr-2 text-brand-purple"></i>학생 사이트로 이동</span>
          <i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>
        </button>
      `;
    }

    function switchTeacherTab(tabName) {
      if (tabName === 'admin') {
        var inputPwd = prompt('관리자 전용 비밀번호를 입력해 주세요:');
        if (inputPwd !== ADMIN_PASSWORD) {
          alert('비밀번호가 올바르지 않습니다.');
          return;
        }
      }
      state.teacherTab = tabName;
      updateSidebarNavForTeacher();
      renderTeacherView();
    }

    function syncDatabase() {
      if (window.isFirebaseReady && window.dbTools) {
        try {
          var collection = window.dbTools.collection;
          var onSnapshot = window.dbTools.onSnapshot;
          
          onSnapshot(collection(window.db, 'interview_registrations'), function(snapshot) {
            state.regs = [];
            snapshot.forEach(function(doc) { state.regs.push(doc.data()); });
            localStorage.setItem('mock_regs', JSON.stringify(state.regs));
            renderTeacherView();
          });

          onSnapshot(collection(window.db, 'interview_students'), function(snapshot) {
            var remoteStudentList = [];
            snapshot.forEach(function(doc) { remoteStudentList.push(doc.data()); });
            if (remoteStudentList.length > 0) {
              STUDENT_LIST = remoteStudentList;
              localStorage.setItem('mock_student_list', JSON.stringify(STUDENT_LIST));
              if (state.teacherTab === 'admin') renderTeacherAdminView();
            }
          });

          onSnapshot(collection(window.db, 'interview_real_reviews'), function(snapshot) {
            state.realReviews = [];
            snapshot.forEach(function(doc) { state.realReviews.push(doc.data()); });
            localStorage.setItem('mock_real_reviews', JSON.stringify(state.realReviews));
            if (state.teacherTab === 'realReviews') renderTeacherRealReviewsView();
          });

          onSnapshot(collection(window.db, 'interview_settings'), function(snapshot) {
            snapshot.forEach(function(doc) {
              if (doc.id === 'closed_dates') {
                state.closedDates = doc.data().dates || [];
                localStorage.setItem('mock_closed_dates', JSON.stringify(state.closedDates));
                renderTeacherView();
              } else if (doc.id === 'teacher_schedule') {
                TEACHER_SCHEDULE = doc.data().schedule || TEACHER_SCHEDULE;
                localStorage.setItem('mock_teacher_schedule', JSON.stringify(TEACHER_SCHEDULE));
                renderTeacherView();
              } else if (doc.id === 'teacher_roster') {
                var data = doc.data();
                if (data.groupA && data.groupB) {
                  TEACHER_A_GROUP = data.groupA;
                  TEACHER_B_GROUP = data.groupB;
                  ALL_TEACHERS = Array.from(new Set([...TEACHER_A_GROUP, ...TEACHER_B_GROUP]));
                  localStorage.setItem('mock_teacher_a_group', JSON.stringify(TEACHER_A_GROUP));
                  localStorage.setItem('mock_teacher_b_group', JSON.stringify(TEACHER_B_GROUP));
                  renderTeacherView();
                }
              }
            });
          });
        } catch(e) { console.warn("Firestore Listener Error", e); }
      }
    }

    function renderTeacherView() {
      if (state.teacherTab === 'calendar') {
        renderTeacherCalendarView();
      } else if (state.teacherTab === 'stats') {
        renderTeacherStatsView();
      } else if (state.teacherTab === 'schedule') {
        renderTeacherScheduleView();
      } else if (state.teacherTab === 'admin') {
        renderTeacherAdminView();
      } else if (state.teacherTab === 'evals') {
        renderTeacherEvalsView();
      } else if (state.teacherTab === 'realReviews') {
        renderTeacherRealReviewsView();
      } else {
        renderTeacherListView();
      }
    }

    function renderTeacherListView() {
      var main = document.getElementById('mainContent');

              <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 whitespace-nowrap">학생별 1~3회차 누적 평가지 관리 및 통합 출력</p>
            </div>
          </div>

          <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
            <div class="flex items-center space-x-2 w-full max-w-sm">
              <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
              <input type="text" placeholder="학생 이름 또는 학번으로 검색..." value="${state.evalSearchKeyword}" oninput="state.evalSearchKeyword = this.value; renderTeacherEvalsView();" class="w-full bg-transparent text-xs focus:outline-none">
            </div>
            <span class="text-xs text-slate-500 whitespace-nowrap">총 <strong>${students.length}명</strong></span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${studentCardsHtml}</div>
        </section>
      `;
    }

    function renderTeacherRealReviewsView() {
      var main = document.getElementById('mainContent');
      if (!main) return;

      var filteredReviews = state.realReviews.filter(function(r) {
        if (!state.realReviewKeyword) return true;
        var kw = state.realReviewKeyword.toLowerCase();
        return (r.univ || '').toLowerCase().includes(kw) ||
               (r.dept || '').toLowerCase().includes(kw) ||
               (r.name || '').toLowerCase().includes(kw) ||
               (r.type || '').toLowerCase().includes(kw);
      });

      var cardsHtml = filteredReviews.map(function(r) {
        var qaItems = r.qaList || (r.questions || []).map(function(q) { return { question: q, answer: '' }; });

        return `
          <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center border-b pb-2.5">
              <div>
                <h4 class="font-bold text-slate-900 text-base">${r.univ} ${r.dept} <span class="bg-purple-100 text-brand-purple text-xs px-2 py-0.5 rounded font-bold ml-1">${r.type}</span></h4>
                <p class="text-xs text-slate-500 mt-0.5">작성자: <strong>${r.name} (${r.num})</strong> | ${r.createdAt}</p>
              </div>
              <button onclick="deleteRealReview('${r.id}')" class="text-red-400 hover:text-red-600 text-xs font-bold underline">삭제</button>
            </div>

            <div class="text-xs space-y-2">
              <p class="font-semibold text-slate-700">📌 면접 일시 및 방식 : <span class="text-slate-900 font-bold">${r.style}</span></p>

              <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                <p class="font-bold text-brand-purple">❓ 실제 받은 질문 & 학생 답변 (${qaItems.length}개)</p>
                ${qaItems.map(function(qa, i) {
                  return `
                    <div class="bg-white p-2.5 rounded-lg border border-slate-200 space-y-1">
                      <p class="font-bold text-slate-900">Q${i+1}. ${qa.question}</p>${qa.answer ? `<p class="text-slate-700 leading-relaxed pl-3">➔ A. ${qa.answer}</p>` : '<p class="text-slate-400 text-[11px] pl-3">(작성된 답변 없음)</p>'}
                    </div>
                  `;
                }).join('')}
              </div>

              ${r.tip ? `
                <div class="bg-amber-50/80 p-3 rounded-xl border border-amber-200 text-amber-900 space-y-0.5">
                  <p class="font-bold"><i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i> 후배들을 위한 꿀팁 & 면접장 분위기</p>
                  <p class="leading-relaxed whitespace-pre-wrap">${r.tip}</p>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('') || '<div class="text-center py-12 text-slate-400 text-xs">등록된 실제 대학 면접 후기가 없습니다.</div>';

      main.innerHTML = `
        <section class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 space-y-5">
          <div class="flex justify-between items-center border-b border-slate-100 pb-3.5 flex-wrap gap-2">
            <div>
              <h3 class="text-base sm:text-lg font-bold text-slate-900 whitespace-nowrap">📚 실제 대학 면접 후기 수집 DB</h3>
              <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 whitespace-nowrap">3학년 학생들이 응시 후 제출한 실제 대학 면접 질문 및 팁 모음 (총 ${filteredReviews.length}건)</p>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="exportRealReviewsToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3.5 py-2 rounded-xl font-bold shadow-sm transition-all whitespace-nowrap">
                📥 엑셀(CSV) 다운로드
              </button>
            </div>
          </div>

          <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
            <div class="flex items-center space-x-2 w-full max-w-sm">
              <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
              <input type="text" placeholder="대학명, 학과, 전형, 학생 이름으로 검색..." value="${state.realReviewKeyword}" oninput="state.realReviewKeyword = this.value; renderTeacherRealReviewsView();" class="w-full bg-transparent text-xs focus:outline-none">
            </div>
            <span class="text-xs text-slate-500 whitespace-nowrap">총 <strong>${filteredReviews.length}건</strong></span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cardsHtml}</div>
        </section>
      `;
    }

    function renderTeacherAdminView() {
      var main = document.getElementById('mainContent');
      if (!main) return;

      var studentRowsHtml = STUDENT_LIST.map(function(s, i) {
        return `
          <tr class="border-b border-slate-100 hover:bg-slate-50 text-xs">
            <td class="py-2 px-2 text-center text-slate-400 whitespace-nowrap">${i + 1}</td>
            <td class="py-2 px-2 font-bold text-slate-800 whitespace-nowrap">${s.num}</td>
            <td class="py-2 px-2 font-bold text-slate-900 whitespace-nowrap">${s.name}</td>
            <td class="py-2 px-2 font-extrabold text-brand-purple tracking-widest whitespace-nowrap">${s.pin}</td>
            <td class="py-2 px-2 text-center whitespace-nowrap">
              <button onclick="deleteSingleStudent('${s.num}', '${s.name}')" class="text-red-500 hover:text-red-700 font-bold underline text-[11px] whitespace-nowrap">삭제</button>
            </td>
          </tr>
        `;
      }).join('');

      var groupARows = TEACHER_A_GROUP.map(function(t, idx) {
        return `
          <div class="flex justify-between items-center bg-amber-50/80 px-3 py-1.5 rounded-xl border border-amber-200 text-xs">
            <span class="font-bold text-amber-900">${idx+1}. ${t} 선생님</span>
            <div class="flex items-center space-x-1.5">
              <button onclick="moveTeacherGroup('${t}', 'A')" class="bg-amber-200 text-amber-900 font-bold px-2 py-0.5 rounded text-[10px] whitespace-nowrap">➔ B그룹 이동</button>
              <button onclick="removeTeacherFromRoster('${t}')" class="text-red-500 font-bold underline text-[10px] ml-1">삭제</button>
            </div>
          </div>
        `;
      }).join('') || '<div class="text-xs text-slate-400 py-2 text-center">등록된 A그룹 교사가 없습니다.</div>';

      var groupBRows = TEACHER_B_GROUP.map(function(t, idx) {
        return `
          <div class="flex justify-between items-center bg-blue-50/80 px-3 py-1.5 rounded-xl border border-blue-200 text-xs">
            <span class="font-bold text-blue-900">${idx+1}. ${t} 선생님</span>
            <div class="flex items-center space-x-1.5">
              <button onclick="moveTeacherGroup('${t}', 'B')" class="bg-blue-200 text-blue-900 font-bold px-2 py-0.5 rounded text-[10px] whitespace-nowrap">➔ A그룹 이동</button>
              <button onclick="removeTeacherFromRoster('${t}')" class="text-red-500 font-bold underline text-[10px] ml-1">삭제</button>
            </div>
          </div>
        `;
      }).join('') || '<div class="text-xs text-slate-400 py-2 text-center">등록된 B그룹 교사가 없습니다.</div>';

      main.innerHTML = `
        <section class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 space-y-5 sm:space-y-6">
          <div class="border-b border-slate-100 pb-3.5">
            <h3 class="text-base sm:text-lg font-bold text-slate-900 whitespace-nowrap">🔐 교사 관리자 전용 포털</h3>
            <p class="text-xs text-slate-500 mt-0.5 whitespace-nowrap">학생 PIN 명단 관리, 내년도 면접관 교사진 변경 및 관리자 설정을 지원합니다.</p>
          </div>

          <div class="bg-purple-50/60 p-4 sm:p-5 rounded-2xl border border-purple-200 space-y-4">
            <div class="space-y-1">
              <h4 class="font-bold text-slate-900 text-xs sm:text-sm flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-user-tie text-brand-purple"></i> 👨‍🏫 3학년 면접관 교사 명단 직접 관리
              </h4>
            </div>

            <div class="flex items-center space-x-2 flex-wrap gap-2 bg-white p-3 rounded-xl border border-purple-200">
              <input type="text" id="newTeacherNameInput" placeholder="선생님 성함 입력 (예: 홍길동)" class="px-3 py-1.5 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-brand-purple w-44 sm:w-56">
              <button onclick="addNewTeacherToGroup('A')" class="bg-amber-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold">+ A그룹 추가</button>
              <button onclick="addNewTeacherToGroup('B')" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold">+ B그룹 추가</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
              <div class="space-y-2">
                <span class="font-bold text-amber-900 text-xs">⭐ A그룹 (${TEACHER_A_GROUP.length}명)</span>
                <div class="space-y-1.5 max-h-48 overflow-y-auto custom-scroll">${groupARows}</div>
              </div>
              <div class="space-y-2">
                <span class="font-bold text-blue-900 text-xs">🔹 B그룹 (${TEACHER_B_GROUP.length}명)</span>
                <div class="space-y-1.5 max-h-48 overflow-y-auto custom-scroll">${groupBRows}</div>
              </div>
            </div>
          </div>

          <div class="space-y-2">
            <h4 class="font-bold text-slate-800 text-xs sm:text-sm">📋 시스템 등록 학생 명단 목록 (총 ${STUDENT_LIST.length}명)</h4>
            <div class="max-h-60 overflow-y-auto custom-scroll rounded-xl border border-slate-200">
              <table class="w-full text-left border-collapse">
                <thead class="sticky top-0 bg-slate-100 text-slate-600 text-xs font-bold border-b border-slate-200">
                  <tr>
                    <th class="py-2 px-2 text-center whitespace-nowrap">No</th>
                    <th class="py-2 px-2 whitespace-nowrap">학번</th>
                    <th class="py-2 px-2 whitespace-nowrap">이름</th>
                    <th class="py-2 px-2 whitespace-nowrap">발급 고유 PIN 코드</th>
                    <th class="py-2 px-2 text-center whitespace-nowrap">관리</th>
                  </tr>
                </thead>
                <tbody>${studentRowsHtml.length > 0 ? studentRowsHtml : '<tr><td colspan="5" class="py-6 text-center text-xs text-slate-400">등록된 학생이 없습니다.</td></tr>'}</tbody>
              </table>
            </div>
          </div>
        </section>
      `;
    }

    function renderTeacherStatsView() {
      var main = document.getElementById('mainContent');
      if (!main) return;

      var totalRegs = state.regs.length;
      var completedRegs = state.regs.filter(function(r) { return r.status === '완료'; }).length;
      var feedbackRegs = state.regs.filter(function(r) { return r.feedback; }).length;
      var absentRegs = state.regs.filter(function(r) { return r.status === '불참'; }).length;

      main.innerHTML = `
        <section class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 space-y-5">
          <div class="flex justify-between items-center border-b border-slate-100 pb-3.5">
            <h3 class="text-base sm:text-lg font-bold text-slate-900">📊 면접교사별 배정 통계 및 종합 리포트</h3>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
            <div class="bg-slate-50 p-3.5 rounded-2xl border"><p class="text-[11px] text-slate-500 font-bold">총 예약</p><p class="text-2xl font-black">${totalRegs}건</p></div>
            <div class="bg-emerald-50 p-3.5 rounded-2xl border"><p class="text-[11px] text-emerald-700 font-bold">실시 완료</p><p class="text-2xl font-black text-emerald-700">${completedRegs}건</p></div>
            <div class="bg-amber-50 p-3.5 rounded-2xl border"><p class="text-[11px] text-amber-700 font-bold">학생 후기</p><p class="text-2xl font-black text-amber-700">${feedbackRegs}건</p></div>
            <div class="bg-red-50 p-3.5 rounded-2xl border"><p class="text-[11px] text-red-600 font-bold">불참/미진행</p><p class="text-2xl font-black text-red-600">${absentRegs}건</p></div>
          </div>
        </section>
      `;
    }

    function toggleTodayOnlyFilter() {
      state.isTodayOnly = !state.isTodayOnly;
      if (state.isTodayOnly) state.dateFilter = '';
      renderTeacherListView();
    }

    function handleDateFilterChange(val) {
      state.dateFilter = val;
      if (val) state.isTodayOnly = false;
      renderTeacherListView();
    }

    function handleTeacherSearch(value) {
      state.searchKeyword = value;
      renderTeacherListView();
    }

    function openOnlineEvalModal(regId) {
      var reg = state.regs.find(function(r) { return r.id === regId; });
      if (!reg) return;
      window.tempEvalRegId = regId;
      window.tempEvalData = JSON.parse(JSON.stringify(reg.evalData || { qaList: [], summary: '' }));
      renderOnlineEvalModalContent(reg);
      document.getElementById('onlineEvalModal').classList.remove('hidden');
    }

    function renderOnlineEvalModalContent(reg) {
      var evalData = window.tempEvalData;
      document.getElementById('evalModalTitle').innerHTML = `<i class="fa-solid fa-laptop-code text-brand-purple"></i> ${reg.name} (${reg.num}) 온라인 면접 평가 기록지`;
      document.getElementById('evalModalContent').innerHTML = `
        <div class="space-y-4">
          <div class="bg-slate-100 p-3 rounded-2xl text-slate-700">학생: <strong>${reg.name} (${reg.num})</strong> | 지원: <strong>${reg.univ} ${reg.dept}</strong></div>
          <textarea id="evalSummaryText" rows="6" class="w-full p-3 border rounded-2xl text-xs bg-slate-50">${evalData.summary || ''}</textarea>
        </div>
      `;
      document.getElementById('saveEvalBtn').onclick = function() { saveOnlineEval(reg.id); };
    }

    function closeOnlineEvalModal() { document.getElementById('onlineEvalModal').classList.add('hidden'); }
    
    function openPreQuestionsModal(regId) {
      var reg = state.regs.find(function(r) { return r.id === regId; });
      if (!reg) return;
      document.getElementById('preQModalTitle').innerHTML = `<i class="fa-solid fa-clipboard-question text-amber-500"></i> ${reg.name} (${reg.num}) 사전 예상 질문지`;
      var preQList = reg.preQuestions || [];
      var listHtml = preQList.map(function(q, idx) {
        return `<div class="bg-slate-50 p-2.5 rounded-xl border text-xs"><p class="font-bold text-brand-purple">[질문 ${idx+1}] (${q.author || '선생님'})</p><p>${q.question}</p></div>`;
      }).join('') || '<div class="text-slate-400 text-center py-4">등록된 사전 질문이 없습니다.</div>';
      document.getElementById('preQModalContent').innerHTML = listHtml;
      document.getElementById('preQuestionsModal').classList.remove('hidden');
    }

    function closePreQuestionsModal() { document.getElementById('preQuestionsModal').classList.add('hidden'); }
    function enableTeacherEdit(id) { state.editingTeacherId = id; renderTeacherListView(); }
    function saveTeachers(id) { state.editingTeacherId = null; renderTeacherListView(); }
    function toggleStudentStatus(id) { renderTeacherListView(); }
    function deleteRegistration(id) { renderTeacherListView(); }

    function toggleTeacherDateSelect() {}
    function selectAllTeacherMonthDates() {}
    function clearSelectedTeacherDates() {}
    function applySelectedBulkClose() {}
    function applyWeekendClose() {}
    function showTeacherDateDetail() {}
    function toggleDateClosed() {}

    function printSingleStudentPreQuestions() {}

    function printStudentCumulativeEvalSheet() {}
    function openSmsModal() {}
    function assignRandomTeachersForDate() {}
    function autoAssignRandomTeachers() {}
    function exportToCSV() {}
    function exportRealReviewsToCSV() {}
    function deleteRealReview() {}
    function saveOnlineEval() { closeOnlineEvalModal(); }
    function changeMonth() {}
    function addNewTeacherToGroup() {}
    function moveTeacherGroup() {}
    function removeTeacherFromRoster() {}
    function deleteSingleStudent() {}
  </script>
