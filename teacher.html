    .reservation-fit-table .cell-two-lines {

      line-clamp:2; overflow:hidden; overflow-wrap:anywhere;
      word-break:keep-all; max-height:2.7em;

    .reservation-fit-table .cell-compact { white-space:nowrap; }
    .reservation-fit-table td button, .reservation-fit-table td select,

    /* 사전질문 및 관리 버튼을 한 줄에 고정 */
    .reservation-fit-table .reservation-actions { flex-wrap:nowrap; gap:2px; width:100%; }

    .reservation-fit-table .reservation-actions button i { margin:0; }
    .reservation-fit-table td:not(:nth-child(6)):not(:nth-child(7)) {white-space:nowrap;}
    .reservation-fit-table .cell-single-line {display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    function syncDatabase() {
      if (window.isFirebaseReady && window.dbTools) {
        try {
          const { collection, onSnapshot } = window.dbTools;
          
          onSnapshot(collection(window.db, 'interview_registrations'), (snapshot) => {
            state.regs = [];
            snapshot.forEach(doc => state.regs.push(doc.data()));
            localStorage.setItem('mock_regs', JSON.stringify(state.regs));
            renderTeacherView();
          });

          onSnapshot(collection(window.db, 'interview_students'), (snapshot) => {
            const remoteStudentList = [];
            snapshot.forEach(doc => remoteStudentList.push(doc.data()));
            if (remoteStudentList.length > 0) {
              STUDENT_LIST = remoteStudentList;
              localStorage.setItem('mock_student_list', JSON.stringify(STUDENT_LIST));
              if (state.teacherTab === 'admin') renderTeacherAdminView();
            }
          });

          onSnapshot(collection(window.db, 'interview_real_reviews'), (snapshot) => {
            state.realReviews = [];
            snapshot.forEach(doc => state.realReviews.push(doc.data()));
            localStorage.setItem('mock_real_reviews', JSON.stringify(state.realReviews));
            if (state.teacherTab === 'realReviews') renderTeacherRealReviewsView();
          });

          onSnapshot(collection(window.db, 'interview_settings'), (snapshot) => {
            snapshot.forEach(doc => {
              if (doc.id === 'extra_reservation_slots') {
                EXTRA_RESERVATION_SLOTS = doc.data().slots || {};
                localStorage.setItem('interview_extra_slots', JSON.stringify(EXTRA_RESERVATION_SLOTS));
                renderTeacherView();
              } else if (doc.id === 'closed_dates') {
                state.closedDates = doc.data().dates || [];
                localStorage.setItem('mock_closed_dates', JSON.stringify(state.closedDates));
                renderTeacherView();
              } else if (doc.id === 'teacher_assignment_mode') {
                TEACHER_ASSIGNMENT_MODE = doc.data().mode === 'random' ? 'random' : 'experience';
                localStorage.setItem('interview_teacher_assignment_mode', TEACHER_ASSIGNMENT_MODE);
                renderTeacherView();
              } else if (doc.id === 'teacher_schedule') {
                TEACHER_SCHEDULE = doc.data().schedule || TEACHER_SCHEDULE;
                localStorage.setItem('mock_teacher_schedule', JSON.stringify(TEACHER_SCHEDULE));
                renderTeacherView();
              } else if (doc.id === 'teacher_roster') {
                const data = doc.data();
                if (data.groupA && data.groupB) {
                  TEACHER_A_GROUP = data.groupA;
                  TEACHER_B_GROUP = data.groupB;
                  ALL_TEACHERS = Array.from(new Set([...TEACHER_A_GROUP, ...TEACHER_B_GROUP]));
                  localStorage.setItem('mock_teacher_a_group', JSON.stringify(TEACHER_A_GROUP));
                  localStorage.setItem('mock_teacher_b_group', JSON.stringify(TEACHER_B_GROUP));
                  renderTeacherView();
                }
              }
            });
          });
        } catch(e) { console.warn("Firestore Listener Error", e); }
      }
    }

    async function deleteRealReview(id) {
      if (!confirm('이 대학 면접 후기를 삭제하시겠습니까?')) return;
      state.realReviews = state.realReviews.filter(r => r.id !== id);
      localStorage.setItem('mock_real_reviews', JSON.stringify(state.realReviews));

      if (window.isFirebaseReady && window.dbTools) {
        try {
          const { doc, deleteDoc } = window.dbTools;
          await deleteDoc(doc(window.db, 'interview_real_reviews', id));
        } catch(e) { console.warn("Delete Real Review Firestore Error", e); }
      }

      renderTeacherRealReviewsView();
      alert('후기가 삭제되었습니다.');
    }

    function exportRealReviewsToCSV() {
      if (state.realReviews.length === 0) {
        alert('다운로드할 면접 후기 데이터가 없습니다.');
        return;
      }

      let csvStr = '\uFEFFNo,학번,이름,대학교,학과,전형유형,면접일시방식,실제질문및답변목록,후기및꿀팁,작성일시\n';
      state.realReviews.forEach((r, i) => {
        const qaItems = r.qaList || (r.questions || []).map(q => ({ question: q, answer: '' }));
        const qaStr = qaItems.map((item, idx) => `Q${idx+1}.${item.question} (A.${item.answer || '-'})`).join(' / ');
        csvStr += `${i+1},${r.num},${r.name},"${r.univ}","${r.dept}","${r.type}","${r.style}","${qaStr.replace(/"/g, '""')}","${(r.tip || '').replace(/"/g, '""')}",${r.createdAt}\n`;
      });

      const blob = new Blob([csvStr], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `강일여고_실제대학면접후기DB_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    async function addManualSlot(dateStr, period) {
      if (!EXTRA_RESERVATION_SLOTS[dateStr]) EXTRA_RESERVATION_SLOTS[dateStr] = {};
      const day = EXTRA_RESERVATION_SLOTS[dateStr];
      const key = String(period);
      if (!day[key]) day[key] = [];
      const teacher1 = document.getElementById(`extraT1_${period}`)?.value || '';
      const teacher2 = document.getElementById(`extraT2_${period}`)?.value || '';
      day[key].push({id: String(Date.now()) + '_' + Math.random().toString(36).slice(2,7), teacher1, teacher2});
      if (await saveExtraReservationSlots()) showTeacherDateDetail(dateStr);
    }

    async function removeManualSlot(dateStr, period, slotId) {
      const arr = (EXTRA_RESERVATION_SLOTS[dateStr] || {})[String(period)] || [];
      const entry = arr.find(x => x.id === slotId);
      if (!entry) return;
      const booked = state.regs.filter(r => r.date === dateStr && Number(r.period) === Number(period)).length;
      if (booked >= getReservationCapacity(dateStr, period)) { alert('이미 예약된 칸은 삭제할 수 없습니다. 먼저 해당 학생의 교시를 변경해 주세요.'); return; }
      if (!confirm('추가한 예약 칸을 삭제하시겠습니까?')) return;
      EXTRA_RESERVATION_SLOTS[dateStr][String(period)] = arr.filter(x => x.id !== slotId);
      if (await saveExtraReservationSlots()) showTeacherDateDetail(dateStr);
    }

    function promptMoveReservation(id) {
      const r = state.regs.find(x => x.id === id);
      if (!r) return;
      const val = prompt(`${r.name} 학생의 새 교시를 입력하세요. (7, 8, 9)`, String(r.period));
      if (val === null) return;
      if (!['7','8','9'].includes(val.trim())) { alert('7, 8, 9 중 하나를 입력해 주세요.'); return; }
      const picker = document.createElement('select');
      picker.id = `movePeriod_${id}`;
      picker.innerHTML = `<option value="${val.trim()}">${val.trim()}</option>`;
      document.body.appendChild(picker);
      moveReservationPeriod(id).finally(() => picker.remove());
    }

    async function moveReservationPeriod(id) {
      const r = state.regs.find(x => x.id === id);
      if (!r) return;
      const next = Number(document.getElementById(`movePeriod_${id}`)?.value);
      if (![7,8,9].includes(next) || next === Number(r.period)) return;
      if (state.regs.some(x => x.id !== id && x.date === r.date && x.num === r.num && Number(x.period) === next)) { alert('해당 학생의 같은 교시 예약이 이미 있습니다.'); return; }
      const occupied = state.regs.filter(x => x.id !== id && x.date === r.date && Number(x.period) === next).length;
      if (occupied >= getReservationCapacity(r.date,next) && !confirm('이동할 교시의 정원이 가득 찼습니다. 관리자로서 정원을 초과하여 이동하시겠습니까?')) return;
      if (!confirm(`${r.name} 학생을 ${r.period}교시에서 ${next}교시로 변경할까요?`)) return;
      // Keep the original document id to preserve evaluation, questions, and other linked data.
      r.period = next;
      localStorage.setItem('mock_regs', JSON.stringify(state.regs));
      if (window.isFirebaseReady && window.dbTools) {
        try { const {doc,setDoc}=window.dbTools; await setDoc(doc(window.db,'interview_registrations',r.id),r); }
        catch(e) { console.error(e); alert('Firebase 반영에 실패했습니다. 연결 상태를 확인해 주세요.'); return; }
      }
      renderTeacherView();
      alert('교시 변경이 완료되었습니다.');
    }

    async function addNewTeacherToGroup(groupType) {
      const inputEl = document.getElementById('newTeacherNameInput');
      const name = inputEl?.value.trim();

      if (!name) {
        alert('추가할 선생님 성함을 입력해 주세요.');
        return;
      }

      if (ALL_TEACHERS.includes(name)) {
        alert(`이미 [${name}] 선생님이 교사 명단에 등록되어 있습니다.`);
        return;
      }

      if (groupType === 'A') TEACHER_A_GROUP.push(name);
      else TEACHER_B_GROUP.push(name);

      await saveTeacherRosterToDb();
      if (inputEl) inputEl.value = '';
      alert(`[${name}] 선생님이 ${groupType}그룹 면접관 명단에 신규 추가되었습니다.`);
      renderTeacherAdminView();
    }

    async function moveTeacherGroup(name, currentGroup) {
      if (currentGroup === 'A') {
        TEACHER_A_GROUP = TEACHER_A_GROUP.filter(t => t !== name);
        if (!TEACHER_B_GROUP.includes(name)) TEACHER_B_GROUP.push(name);
        alert(`[${name}] 선생님이 B그룹(후임/저경력)으로 이동되었습니다.`);
      } else {
        TEACHER_B_GROUP = TEACHER_B_GROUP.filter(t => t !== name);
        if (!TEACHER_A_GROUP.includes(name)) TEACHER_A_GROUP.push(name);
        alert(`[${name}] 선생님이 A그룹(선임/고경력)으로 이동되었습니다.`);
      }

      await saveTeacherRosterToDb();
      renderTeacherAdminView();
    }

    async function removeTeacherFromRoster(name) {

      TEACHER_A_GROUP = TEACHER_A_GROUP.filter(t => t !== name);
      TEACHER_B_GROUP = TEACHER_B_GROUP.filter(t => t !== name);

      await saveTeacherRosterToDb();
      alert(`[${name}] 선생님이 교사 명단에서 삭제되었습니다.`);
      renderTeacherAdminView();
    }

    async function assignRandomTeachersForDate(targetDateStr) {
      if (!targetDateStr) { alert('날짜를 먼저 선택해 주세요.'); return; }
      const rows=state.regs.filter(r=>r.date===targetDateStr);
      if(!rows.length) { alert('해당 날짜에 면접 신청 학생이 없습니다.'); return; }
      if(!confirm(`${targetDateStr} 날짜의 미배정 학생에게 현재 방식으로 2인 1조 면접교사를 배정할까요?\n이미 배정한 학생은 변경하지 않습니다.`)) return;
      const count=await assignTeacherPairsForDates([targetDateStr]);
      alert(`배정 완료: ${count}건 (기존 배정 유지)`); renderTeacherView();
    }

    async function autoAssignRandomTeachers() {
      if(!state.regs.length) { alert('배정할 학생이 없습니다.'); return; }
      if(!confirm('전체 날짜의 미배정 학생만 자동 배정할까요? 이미 배정된 학생은 유지됩니다.')) return;
      const count=await assignTeacherPairsForDates([...new Set(state.regs.map(r=>r.date))].sort());
      alert(`전체 날짜 배정 완료: ${count}건 (기존 배정 유지)`); renderTeacherView();
    }

    async function assignTeacherPairsForDates(dates) {
      if(!window.isFirebaseReady || !window.dbTools) { alert('Firebase 연결 확인 후 다시 시도해 주세요.'); return 0; }
      const {doc,setDoc}=window.dbTools;
      const changed=[];
      const workload=getTeacherWorkloadCounts();
      for(const dateStr of dates) {
        // 같은 날짜, 같은 교시에서는 교사를 중복 배정하지 않도록 합니다.
        const allPairs=createTeacherPairsForDate(dateStr,workload);
        if(!allPairs.length) continue;
        for(const period of [7,8,9]) {
          const rows=state.regs.filter(r=>r.date===dateStr && Number(r.period)===period);
          const busy=new Set(rows.flatMap(r=>[r.teacher1,r.teacher2].filter(Boolean)));
          const freePairs=allPairs.filter(p=>!busy.has(p.t1)&&!busy.has(p.t2));
          for(const reg of rows) {
            if(reg.teacher1 || reg.teacher2) continue;
            const pair=freePairs.shift(); if(!pair) break;
            const updated={...reg,teacher1:pair.t1,teacher2:pair.t2};
            try {
              await setDoc(doc(window.db,'interview_registrations',reg.id), updated);
              Object.assign(reg,updated); changed.push(reg);
              busy.add(pair.t1);busy.add(pair.t2);
              workload[pair.t1]=(workload[pair.t1]||0)+1;
              workload[pair.t2]=(workload[pair.t2]||0)+1;
            } catch(e) { console.error(e); alert('일부 배정의 Firebase 저장에 실패했습니다. 다시 확인해 주세요.'); localStorage.setItem('mock_regs',JSON.stringify(state.regs));return changed.length; }
          }
        }
      }
      localStorage.setItem('mock_regs',JSON.stringify(state.regs));
      return changed.length;
    }

    async function processAndGeneratePinFromCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const text = e.target.result;
        const lines = text.split('\n');
        const generatedList = [];
        const usedPins = new Set();

        lines.forEach((line, index) => {
          if (index === 0 || !line.trim()) return;
          const cols = line.split(',');
          if (cols.length >= 3) {
            const no = cols[0] ? String(cols[0]).trim() : String(index);
            const num = cols[1] ? String(cols[1]).trim() : '';
            const name = cols[2] ? String(cols[2]).trim() : '';
            const existingPin = cols[3] ? String(cols[3]).trim() : '';

            if (num && name) {
              let pin = existingPin;
              if (!pin || pin.length < 6) {
                do {
                  pin = String(Math.floor(100000 + Math.random() * 900000));
                } while (usedPins.has(pin));
              }

              usedPins.add(pin);
              generatedList.push({ no, num, name, pin });
            }
          }
        });

        if (generatedList.length > 0) {
          STUDENT_LIST = generatedList;
          await saveStudentListToOnlineDb();
          alert(`[일괄 등록 완료]\n\n총 ${generatedList.length}명 학생 데이터와 고유 PIN 코드가 온라인 DB에 안전하게 동기화되었습니다!`);
          renderTeacherAdminView();
        } else {
          alert('CSV 파일에서 학생 정보를 읽을 수 없습니다. 양식을 확인해 주세요.');
        }
      };

    function getReservationCapacity(dateStr, period) {
      const base = getMaxTeamsForDate(dateStr);
      return base + ([8, 9].includes(Number(period)) ? ((EXTRA_RESERVATION_SLOTS[dateStr] || {})[String(period)] || []).length : 0);
    }

    function getMaxTeamsForDate(dateStr) {
      const availList = [...new Set(TEACHER_SCHEDULE[dateStr] || [])].filter(t => ALL_TEACHERS.includes(t));
      if (TEACHER_ASSIGNMENT_MODE === 'random') return Math.floor(availList.length / 2);
      const countA = availList.filter(t => TEACHER_A_GROUP.includes(t)).length;
      const countB = availList.filter(t => TEACHER_B_GROUP.includes(t)).length;

      const standardPairs = Math.min(countA, countB);
      const remA = countA - standardPairs;
      const extraSeniorPairs = Math.floor(remA / 2);

      return standardPairs + extraSeniorPairs;
    }

    async function saveTeacherAssignmentMode() {
      const selected = document.querySelector('input[name="teacherAssignmentMode"]:checked')?.value;
      if (!['experience', 'random'].includes(selected)) return;
      if (selected === TEACHER_ASSIGNMENT_MODE) { alert('이미 선택된 배정 방식입니다.'); return; }
      if (!confirm(`면접교사 배정 방식을 [${selected === 'random' ? '전체 무작위' : '경력별'}]로 변경하시겠습니까?\n기존 예약 및 배정은 유지됩니다.`)) return;
      if (!window.isFirebaseReady || !window.dbTools) {
        alert('Firebase 연결이 준비되지 않았습니다. 잠시 후 다시 시도해 주세요.'); return;
      }
      try {
        const {doc,setDoc} = window.dbTools;
        await setDoc(doc(window.db,'interview_settings','teacher_assignment_mode'), {mode:selected});
        TEACHER_ASSIGNMENT_MODE=selected;
        localStorage.setItem('interview_teacher_assignment_mode', selected);
        renderTeacherAdminView();
        alert('배정 방식이 저장되었습니다. 학생용 예약 정원에도 반영됩니다.');
      } catch(e) { console.error(e); alert('저장에 실패했습니다. Firestore 권한 및 연결 상태를 확인해 주세요.'); }
    }

    // 참여 교사를 날짜별로 2명씩 묶습니다. 홀수 인원은 배정하지 않습니다.
    function createTeacherPairsForDate(dateStr, workload = {}) {
      const participants=[...new Set(TEACHER_SCHEDULE[dateStr] || [])].filter(t=>ALL_TEACHERS.includes(t));
      const shuffle = arr => {
        const result=[...arr];
        for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}
        return result;
      };
      if(TEACHER_ASSIGNMENT_MODE === 'random') {
        const pool=shuffle(participants);
        const result=[];
        while(pool.length>=2) result.push({t1:pool.shift(),t2:pool.shift()});
        return result;
      }
      const sortWorkload=arr=>shuffle(arr).sort((a,b)=>(workload[a]||0)-(workload[b]||0));
      const senior=sortWorkload(participants.filter(t=>TEACHER_A_GROUP.includes(t)));
      const junior=sortWorkload(participants.filter(t=>TEACHER_B_GROUP.includes(t)));
      const result=[];
      while(senior.length && junior.length) result.push({t1:senior.shift(),t2:junior.shift()});
      while(senior.length>=2) result.push({t1:senior.shift(),t2:senior.shift()});
      return result;
    }

      const reg = state.regs.find(r => r.id === id);
      if (!reg) return;

      const current = reg.status || '대기';
      let nextStatus = '완료';
      if (current === '대기') nextStatus = '완료';
      else if (current === '완료') nextStatus = '불참';
      else nextStatus = '대기';

      reg.status = nextStatus;
      localStorage.setItem('mock_regs', JSON.stringify(state.regs));

      if (window.isFirebaseReady && window.dbTools) {
        try {
          const { doc, setDoc } = window.dbTools;
          await setDoc(doc(window.db, 'interview_registrations', id), reg);
        } catch(e) { console.warn("Firestore Status Save Error", e); }
      }

      renderTeacherListView();
    }

    // 예약 목록: 열 너비 최적화 + 모든 예약 행 높이 통일

        const kw = state.searchKeyword.toLowerCase();

              <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5">실시간 면접 신청 현황 및 현장 평가 입력 (총 ${filteredRegs.length}건)</p>

            <div class="flex items-center space-x-1.5 flex-wrap gap-1.5">

              <button onclick="printEvaluationSheet()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl font-bold shadow-sm transition-all">

                  <th class="text-center">학번</th>
                  <th class="text-center">이름</th>
                  <th class="text-center">지원 대학교</th>
                  <th class="text-center">지원 학과</th>
                  <th class="text-center">요청사항</th>
                  <th class="text-center">상태</th>
                  <th class="text-center">사전질문</th>

    function toggleTodayOnlyFilter() {
      state.isTodayOnly = !state.isTodayOnly;
      if (state.isTodayOnly) state.dateFilter = '';
      renderTeacherListView();
    }

    function handleDateFilterChange(val) {
      state.dateFilter = val;
      if (val) state.isTodayOnly = false;
      renderTeacherListView();
    }

    function handleTeacherSearch(value) {
      state.searchKeyword = value;
      renderTeacherListView();
    }

      const main = document.getElementById('mainContent');
      if (!main) return;

      const firstDay = new Date(state.year, state.month - 1, 1).getDay();
      const lastDate = new Date(state.year, state.month, 0).getDate();

      let calGridHtml = '';
      for (let i = 0; i < firstDay; i++) {
        calGridHtml += `<div class="bg-slate-50/50 rounded-xl p-2 min-h-[120px]"></div>`;
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const activeList = TEACHER_SCHEDULE[dateStr] || [];
        const isClosed = state.closedDates.includes(dateStr);

        const teacherCheckboxes = ALL_TEACHERS.map(t => {
          const isChecked = activeList.includes(t);
          return `
            <label class="inline-flex items-center space-x-1 text-[10px] sm:text-[11px] whitespace-nowrap cursor-pointer hover:bg-slate-100 p-0.5 rounded ${isClosed ? 'opacity-50 cursor-not-allowed' : ''}">
              <input type="checkbox" onchange="toggleTeacherForDate('${dateStr}', '${t}', this.checked)" ${isChecked ? 'checked' : ''} ${isClosed ? 'disabled' : ''} class="w-3 h-3 text-brand-purple rounded shrink-0">
              <span class="${isChecked ? 'font-bold text-slate-800' : 'text-slate-400'} leading-none">${t}</span>
            </label>
          `;
        }).join('');

        calGridHtml += `

            <div>
              <div class="flex justify-between items-center border-b border-slate-200 pb-1 mb-1">
                <span class="font-extrabold ${isClosed ? 'text-slate-500' : 'text-slate-900'} text-xs whitespace-nowrap">${d}일</span>
                ${isClosed 
                  ? '<span class="text-[9px] font-bold text-slate-600 bg-slate-200 px-1 py-0.5 rounded-full whitespace-nowrap">마감</span>' 
                  : `<span class="text-[9px] font-bold text-brand-purple bg-brand-purpleLight px-1 py-0.5 rounded-full whitespace-nowrap">${activeList.length}명</span>`}

              <div class="grid grid-cols-2 gap-x-0.5 gap-y-0.5">
                ${teacherCheckboxes}
              </div>

      main.innerHTML = `

              <button onclick="changeMonth(-1)" class="px-2.5 py-1 border rounded-lg text-xs font-bold whitespace-nowrap">◀ 이전달</button>
              <span id="calMonthText" class="font-bold text-xs sm:text-sm px-1.5 text-brand-navy whitespace-nowrap">${state.year}년 ${state.month}월</span>

          <div class="grid grid-cols-7 gap-1 sm:gap-2">
            ${calGridHtml}

        </section>
      `;
    }

    async function toggleTeacherForDate(dateStr, teacherName, isChecked) {
      if (!TEACHER_SCHEDULE[dateStr]) TEACHER_SCHEDULE[dateStr] = [];
      
      if (isChecked) {
        if (!TEACHER_SCHEDULE[dateStr].includes(teacherName)) {
          TEACHER_SCHEDULE[dateStr].push(teacherName);
        }
      } else {
        TEACHER_SCHEDULE[dateStr] = TEACHER_SCHEDULE[dateStr].filter(t => t !== teacherName);
      }

      await saveTeacherScheduleToDb();
      renderTeacherScheduleView();
    }

    function getTeacherWorkloadCounts() {
      const counts = {};
      ALL_TEACHERS.forEach(t => counts[t] = 0);

      state.regs.forEach(r => {
        if (r.teacher1) counts[r.teacher1] = (counts[r.teacher1] || 0) + 1;
        if (r.teacher2) counts[r.teacher2] = (counts[r.teacher2] || 0) + 1;
      });
      return counts;
    }

      const todayStr = new Date().toISOString().slice(0, 10);
      const myTodayStudents = state.regs.filter(r => r.date === todayStr && (r.teacher1 === teacherName || r.teacher2 === teacherName));

      alert(`[오늘(${todayStr}) ${teacherName} 선생님 담당 학생]\n총 ${myTodayStudents.length}명\n\n` + 
        (myTodayStudents.length > 0 
          ? myTodayStudents.map(r => `· [${r.period}교시] ${r.name}(${r.num}) - ${r.univ} ${r.dept}`).join('\n')
          : '오늘 배정된 면접 학생이 없습니다.')
      );
    }

    async function updateLocation(id, newLoc) {
      const reg = state.regs.find(r => r.id === id);
      if (reg) {
        reg.location = newLoc.trim() || '3층 소형강의실';
        localStorage.setItem('mock_regs', JSON.stringify(state.regs));

        if (window.isFirebaseReady && window.dbTools) {
          try {
            const { doc, setDoc } = window.dbTools;
            await setDoc(doc(window.db, 'interview_registrations', id), reg);
          } catch(e) { console.warn("Firestore Location Save Error", e); }
        }
      }
    }

    function renderTeacherCalendarView() {
      const main = document.getElementById('mainContent');
      if (!main) return;

      const firstDay = new Date(state.year, state.month - 1, 1).getDay();
      const lastDate = new Date(state.year, state.month, 0).getDate();

      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      let calGridHtml = '';
      for (let i = 0; i < firstDay; i++) {
        calGridHtml += `<div class="h-24 sm:h-28 bg-slate-50/50 rounded-xl"></div>`;
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        
        const isClosed = state.closedDates.includes(dateStr);
        const isChecked = state.selectedTeacherDates.includes(dateStr);
        const isToday = dateStr === todayStr;
        const isPast = dateStr < todayStr;

        const dayRegs = state.regs.filter(r => r.date === dateStr);
        const completedCount = dayRegs.filter(r => r.status === '완료').length;

        let regsSummary = dayRegs.length > 0 ? dayRegs.map(r => {
          const p = Number(r.period);
          const isDone = r.status === '완료';

          let badgeStyle = 'bg-purple-50 text-purple-700 border-purple-200';
          if (p === 7) badgeStyle = 'bg-emerald-50 text-emerald-700 border-emerald-200';
          else if (p === 8) badgeStyle = 'bg-indigo-50 text-indigo-700 border-indigo-200';

          if (isDone) {
            badgeStyle = 'bg-slate-100 text-slate-500 border-slate-200 opacity-70';
          }

          return `
            <div class="text-[9px] sm:text-[10px] ${badgeStyle} border font-bold px-1 py-0.5 rounded truncate whitespace-nowrap flex items-center justify-between shrink-0 mb-0.5">
              <span>[${r.period}교시] ${r.name}</span>
              ${isDone ? '<span class="text-[8px] bg-emerald-600 text-white font-extrabold px-1 rounded-full ml-1">✔완료</span>' : ''}
            </div>
          `;
        }).join('') : `<div class="text-[9px] text-slate-400 mt-1 whitespace-nowrap">신청 없음</div>`;

        let cardBgClass = 'bg-white border-slate-200 hover:border-brand-purple';
        if (isToday) {
          cardBgClass = 'bg-amber-50/40 border-2 border-brand-orange ring-2 ring-brand-orange/20 shadow-sm';
        } else if (isPast) {
          cardBgClass = 'bg-slate-100/70 border-slate-200/80 opacity-80';
        } else if (isClosed) {
          cardBgClass = 'bg-slate-100 text-slate-400 opacity-70 border-slate-200';
        }

        calGridHtml += `
          <div onclick="toggleTeacherDateSelect('${dateStr}')" class="h-24 sm:h-28 border ${isChecked ? 'border-brand-purple bg-brand-purpleLight/40 ring-2 ring-brand-purple/40 font-bold' : cardBgClass} rounded-xl p-1.5 sm:p-2 cursor-pointer flex flex-col justify-between transition-all relative overflow-hidden">
            <div>
              <div class="flex justify-between items-center">
                <div class="flex items-center gap-1">
                  <span class="text-xs font-bold ${isPast ? 'text-slate-500' : isClosed ? 'text-slate-400' : 'text-slate-800'}">${d}</span>
                  ${isToday ? '<span class="bg-brand-orange text-white text-[8px] font-extrabold px-1 rounded-full">오늘</span>' : ''}
                </div>
                <div class="flex items-center gap-0.5 whitespace-nowrap">
                  ${isChecked ? '<span class="bg-brand-purple text-white text-[8px] px-1 py-0.5 rounded-full font-bold whitespace-nowrap">✓</span>' : ''}
                  ${isClosed 
                    ? '<span class="text-[9px] bg-slate-200 text-slate-600 font-bold px-1 rounded whitespace-nowrap">마감</span>' 
                    : isPast && dayRegs.length > 0 
                      ? `<span class="text-[9px] text-emerald-700 font-extrabold bg-emerald-50 px-1 rounded whitespace-nowrap">${completedCount}/${dayRegs.length}완료</span>`
                      : `<span class="text-[9px] text-slate-500 font-bold whitespace-nowrap">${dayRegs.length}건</span>`}
                </div>
              </div>
            </div>
            <div class="max-h-[62px] overflow-y-auto custom-scroll mt-1 pr-0.5" onclick="event.stopPropagation()">
              ${regsSummary}
            </div>
          </div>
        `;
      }

      main.innerHTML = `
        <section class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 space-y-4 sm:space-y-5">
          <div class="flex justify-between items-center border-b border-slate-100 pb-3.5">
            <div>
              <h3 class="text-base sm:text-lg font-bold text-slate-900 whitespace-nowrap">📅 달력 일정 및 마감 관리</h3>
              <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 whitespace-nowrap">날짜별 마감 및 진행 상태 지정 (카드 내부 스크롤 가능)</p>
            </div>
            <div class="flex items-center space-x-1.5 whitespace-nowrap">
              <button onclick="changeMonth(-1)" class="px-2.5 py-1 border rounded-lg text-xs font-bold whitespace-nowrap">◀ 이전달</button>
              <span id="calMonthText" class="font-bold text-xs sm:text-sm px-1.5 text-brand-navy whitespace-nowrap">${state.year}년 ${state.month}월</span>
              <button onclick="changeMonth(1)" class="px-2.5 py-1 border rounded-lg text-xs font-bold whitespace-nowrap">다음달 ▶</button>
            </div>
          </div>

          <div class="bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200 space-y-2.5">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center space-x-2 text-xs font-bold text-slate-700 whitespace-nowrap">
                <i class="fa-solid fa-hand-pointer text-brand-purple"></i>
                <span>선택: <strong class="text-brand-purple text-xs sm:text-sm">${state.selectedTeacherDates.length}개</strong></span>
              </div>
              <div class="flex items-center space-x-1.5 flex-wrap gap-1">
                <button onclick="selectAllTeacherMonthDates()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2.5 py-1 rounded-lg font-bold transition-all whitespace-nowrap">
                  전체 선택
                </button>
                <button onclick="clearSelectedTeacherDates()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2.5 py-1 rounded-lg font-bold transition-all whitespace-nowrap">
                  해제
                </button>
                <button onclick="applySelectedBulkClose(true)" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1 rounded-lg font-bold transition-all shadow-sm whitespace-nowrap">
                  마감
                </button>
                <button onclick="applySelectedBulkClose(false)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1 rounded-lg font-bold transition-all shadow-sm whitespace-nowrap">
                  해제
                </button>
                <button onclick="applyWeekendClose(true)" class="bg-slate-700 hover:bg-slate-800 text-white text-xs px-2.5 py-1 rounded-lg font-bold transition-all whitespace-nowrap">
                  주말 마감
                </button>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-xs font-bold text-slate-500 py-1.5 border-b border-slate-100">
            <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
          </div>
          <div class="grid grid-cols-7 gap-1 sm:gap-2">
            ${calGridHtml}
          </div>

          <div id="teacherCalDetail" class="hidden border-t pt-4 space-y-3"></div>
        </section>
      `;
    }

    function toggleTeacherDateSelect(dateStr) {
      if (state.selectedTeacherDates.includes(dateStr)) {
        state.selectedTeacherDates = state.selectedTeacherDates.filter(d => d !== dateStr);
      } else {
        state.selectedTeacherDates.push(dateStr);
      }
      renderTeacherCalendarView();
      showTeacherDateDetail(dateStr);
    }

    function selectAllTeacherMonthDates() {
      const lastDate = new Date(state.year, state.month, 0).getDate();
      state.selectedTeacherDates = [];
      for (let d = 1; d <= lastDate; d++) {
        state.selectedTeacherDates.push(`${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
      }
      renderTeacherCalendarView();
    }

    function clearSelectedTeacherDates() {
      state.selectedTeacherDates = [];
      renderTeacherCalendarView();
    }

    async function applySelectedBulkClose(isClose) {
      if (state.selectedTeacherDates.length === 0) {
        alert('달력에서 일괄 변경할 날짜를 먼저 클릭하여 선택해 주세요.');
        return;
      }

      let count = 0;
      state.selectedTeacherDates.forEach(dStr => {
        if (isClose) {
          if (!state.closedDates.includes(dStr)) {
            state.closedDates.push(dStr);
            count++;
          }
        } else {
          if (state.closedDates.includes(dStr)) {
            state.closedDates = state.closedDates.filter(d => d !== dStr);
            count++;
          }
        }
      });

      await saveClosedDatesToDb();
      alert(`선택한 ${state.selectedTeacherDates.length}개 중 ${count}개 날짜가 일괄 ${isClose ? '마감' : '해제'} 처리되었습니다.`);
      state.selectedTeacherDates = [];
      renderTeacherCalendarView();
    }

    async function applyWeekendClose(isClose) {
      const lastDate = new Date(state.year, state.month, 0).getDate();
      let count = 0;

      for (let d = 1; d <= lastDate; d++) {
        const dateObj = new Date(state.year, state.month - 1, d);
        const day = dateObj.getDay();
        if (day === 0 || day === 6) {
          const dStr = `${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          if (isClose) {
            if (!state.closedDates.includes(dStr)) {
              state.closedDates.push(dStr);
              count++;
            }
          }
        }
      }

      await saveClosedDatesToDb();
      alert(`${state.month}월 모든 주말(토/일)이 일괄 마감 처리되었습니다.`);
      renderTeacherCalendarView();
    }

    function showTeacherDateDetail(dateStr) {
      const container = document.getElementById('teacherCalDetail');
      if (!container) return;

      const isClosed = state.closedDates.includes(dateStr);
      const dayRegs = state.regs.filter(r => r.date === dateStr);
      const availTeachers = TEACHER_SCHEDULE[dateStr] || [];
      const maxTeams = getMaxTeamsForDate(dateStr);

      const extraSlotControls = [8,9].map(period => {
        const slots = (EXTRA_RESERVATION_SLOTS[dateStr] || {})[String(period)] || [];
        const booked = dayRegs.filter(r => Number(r.period) === period).length;
        const options = `<option value="">담당 교사 미지정</option>` + availTeachers.map(t => `<option value="${t}">${t}</option>`).join('');
        return `<div class="bg-white rounded-xl border border-slate-200 p-3 space-y-2 text-xs">
          <div class="font-bold">${period}교시 · 자동 ${maxTeams}칸 + 수동 ${slots.length}칸 = ${getReservationCapacity(dateStr,period)}칸 (예약 ${booked}명)</div>
          <div class="flex flex-wrap gap-2 items-center">
            <select id="extraT1_${period}" class="border rounded-lg px-2 py-1.5 min-w-0">${options}</select>
            <select id="extraT2_${period}" class="border rounded-lg px-2 py-1.5 min-w-0">${options}</select>
            <button onclick="addManualSlot('${dateStr}', ${period})" class="bg-brand-purple text-white px-3 py-1.5 rounded-lg font-bold">+ 예약 칸 추가</button>
          </div>
          <div class="flex flex-wrap gap-2">${slots.map((slot,i) => `<span class="inline-flex gap-1 items-center bg-slate-100 rounded-lg px-2 py-1">추가 ${i+1}칸: ${[slot.teacher1,slot.teacher2].filter(Boolean).join('/') || '교사 미지정'} <button onclick="removeManualSlot('${dateStr}',${period},'${slot.id}')" class="text-red-600" title="칸 삭제">✕</button></span>`).join('')}</div>
        </div>`;
      }).join('');

      let listHtml = dayRegs.map(r => {
        const assignedTeachers = [r.teacher1, r.teacher2].filter(Boolean);
        const teacherBadge = assignedTeachers.length > 0 
          ? `<span class="bg-brand-purpleLight text-brand-purple px-2 py-0.5 rounded font-bold text-xs whitespace-nowrap">담당: ${assignedTeachers.join(', ')}</span>`
          : `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold text-xs whitespace-nowrap">미배정</span>`;

        return `
          <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-xs border border-slate-200 flex-wrap gap-2">
            <div class="flex items-center space-x-2">
              <span class="font-extrabold text-brand-purple bg-white px-2 py-1 rounded border border-brand-purple/30 whitespace-nowrap">[${r.period}교시]</span>
              <div>
                <span class="font-bold text-slate-900 text-xs sm:text-sm whitespace-nowrap">${r.name} (${r.num})</span>
                <span class="text-slate-500 ml-1.5 whitespace-nowrap">${r.univ} ${r.dept}</span>
                ${r.note ? `<span class="text-amber-700 font-medium ml-1.5 whitespace-nowrap">(${r.note})</span>` : ''}
                <span class="text-brand-purple font-bold ml-1.5 whitespace-nowrap">장소: ${r.location || '3층 소형강의실'}</span>
              </div>
            </div>
            <div class="flex items-center space-x-2 self-end sm:self-auto whitespace-nowrap">
              ${teacherBadge}
              <button onclick="openOnlineEvalModal('${r.id}')" class="bg-brand-purple text-white px-2 py-1 rounded-lg font-bold text-xs whitespace-nowrap">📝 온라인 평가지</button>
              <button onclick="promptMoveReservation('${r.id}')" class="text-indigo-600 font-bold underline whitespace-nowrap">교시 변경</button>
              <button onclick="deleteRegistration('${r.id}')" class="text-red-500 hover:text-red-700 font-bold underline ml-1 whitespace-nowrap">삭제</button>
            </div>
          </div>
        `;
      }).join('') || '<div class="text-xs text-slate-400 py-3 text-center bg-slate-50 rounded-xl border border-dashed border-slate-200 whitespace-nowrap">이 날짜에 신청된 면접 예약이 없습니다.</div>';

      container.classList.remove('hidden');
      container.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-brand-purpleLight/50 p-3.5 sm:p-4 rounded-xl border border-brand-purple/20 gap-2">
          <div>
            <h4 class="font-bold text-slate-900 text-xs sm:text-sm whitespace-nowrap">📅 ${dateStr} 신청 현황 (정원: 8교시 ${getReservationCapacity(dateStr,8)}명 / 9교시 ${getReservationCapacity(dateStr,9)}명)</h4>
            <p class="text-[11px] sm:text-xs text-slate-600 mt-0.5 whitespace-nowrap">가능 교사: <strong>${availTeachers.length > 0 ? availTeachers.join(', ') : '없음/공휴일'}</strong></p>
          </div>
          <div class="flex items-center space-x-2 self-end sm:self-auto whitespace-nowrap">
            <button onclick="printDatePreQuestions('${dateStr}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl transition-all shadow-sm whitespace-nowrap">
              📄 사전 질문지 일괄 인쇄
            </button>
            <button onclick="printEvaluationSheet('${dateStr}')" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl transition-all shadow-sm whitespace-nowrap">
              📄 평가 기록지 인쇄
            </button>
            <button onclick="toggleDateClosed('${dateStr}')" class="${isClosed ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-500 hover:bg-red-600'} text-white text-xs font-bold px-3 py-1.5 rounded-xl transition-all shadow-sm whitespace-nowrap">
              ${isClosed ? '마감 해제' : '개별 마감'}
            </button>
          </div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-2 pt-2">${extraSlotControls}</div>
        <div class="space-y-2 pt-1">
          ${listHtml}
        </div>
      `;
    }

    async function toggleDateClosed(dateStr) {
      if (state.closedDates.includes(dateStr)) {
        state.closedDates = state.closedDates.filter(d => d !== dateStr);
        alert(`${dateStr} 날짜가 정상 운영(예약 가능)으로 재개되었습니다.`);
      } else {
        state.closedDates.push(dateStr);
        alert(`${dateStr} 날짜가 마감 처리되었습니다.`);
      }
      await saveClosedDatesToDb();
      renderTeacherCalendarView();
      showTeacherDateDetail(dateStr);
    }

    async function saveTeachers(id) {
      const t1 = document.getElementById(`t1Input_${id}`)?.value || '';
      const t2 = document.getElementById(`t2Input_${id}`)?.value || '';

      if (t1 && t2 && t1 === t2) { alert('같은 교사를 2명으로 중복 지정할 수 없습니다.'); return; }
      const reg = state.regs.find(r => r.id === id);
      if (reg) {
        reg.teacher1 = t1;
        reg.teacher2 = t2;
        localStorage.setItem('mock_regs', JSON.stringify(state.regs));

        if (window.isFirebaseReady && window.dbTools) {
          try {
            const { doc, setDoc } = window.dbTools;
            await setDoc(doc(window.db, 'interview_registrations', id), reg);
          } catch(e) { console.warn("Firestore Teacher Save Error", e); }
        }

        state.editingTeacherId = null;
        alert(`담당 면접교사가 완벽히 저장되었습니다.`);
        renderTeacherView();
      }
    }

    async function deleteRegistration(id) {
      if (!confirm('이 학생의 면접 예약 내역을 취소/삭제하시겠습니까?')) return;
      state.regs = state.regs.filter(r => r.id !== id);
      localStorage.setItem('mock_regs', JSON.stringify(state.regs));

      if (window.isFirebaseReady && window.dbTools) {
        try {
          const { doc, deleteDoc } = window.dbTools;
          await deleteDoc(doc(window.db, 'interview_registrations', id));
        } catch(e) { console.warn("Delete Firestore Error", e); }
      }

      renderTeacherView();
      alert('예약 내역이 삭제되었습니다.');
    }

    function changeMonth(delta) {
      state.month += delta;
      if (state.month < 1) {
        state.month = 12;
        state.year -= 1;
      } else if (state.month > 12) {
        state.month = 1;
        state.year += 1;
      }
      
      const monText = document.getElementById('calMonthText');
      if (monText) monText.textContent = `${state.year}년 ${state.month}월`;
      
      state.selectedTeacherDates = [];
      renderTeacherView();
    }
  </script>
</body>
</html>
