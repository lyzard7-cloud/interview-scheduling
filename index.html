<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고등학교 대입 면접 연습 배정 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: {
            sidebar: '#1C1917',
            cream: '#FBF9F5',
            burgundy: { DEFAULT: '#8B263E', hover: '#721F32', light: '#FDF2F4' }
          }
        }
      }
    }
  </script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7xuekPxP9C_JIo586h-XvsbWMM7Lzle0",
      authDomain: "interview-system-b3b6e.firebaseapp.com",
      projectId: "interview-system-b3b6e",
      storageBucket: "interview-system-b3b6e.firebasestorage.app",
      messagingSenderId: "1017259873467",
      appId: "1:1017259873467:web:27440e2d6d496938c6c59e"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
  </script>
</head>
<body class="bg-cream text-slate-800 min-h-screen flex font-sans antialiased">
  <!-- 좌측 다크 사이드바 -->
  <aside class="w-64 bg-sidebar text-slate-300 flex flex-col shrink-0 min-h-screen border-r border-stone-800">
    <div class="p-6 border-b border-stone-800 flex items-center space-x-3">
      <div class="w-9 h-9 bg-burgundy rounded-xl flex items-center justify-center text-white font-bold shadow-md">결</div>
      <div>
        <h1 class="font-bold text-white text-base tracking-tight">대입 면접 배정</h1>
        <p class="text-xs text-stone-400">학생부 맞춤형 연습</p>
      </div>
    </div>
    <nav class="p-4 space-y-1.5 flex-1">
      <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-stone-800/80 text-white font-medium">
        <i class="fa-solid fa-calendar-check text-burgundy"></i>
        <span>면접 신청 포털</span>
      </a>
    </nav>
  </aside>

  <!-- 메인 컨텐츠 영역 -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white/80 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-30 px-8 py-4">
      <div class="text-xs text-stone-500 mb-1">면접 연습 시스템 / 학생 포털</div>
      <h2 class="text-2xl font-bold text-stone-900">면접 연습 신청</h2>
    </header>

    <main class="p-8 max-w-5xl space-y-6">
      <!-- Step 1: 학생 인증 -->
      <section class="bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm space-y-4">
        <div class="flex justify-between items-center">
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-burgundy-light text-burgundy">STEP 1</span>
        </div>
        <h3 class="text-lg font-bold text-stone-900">학생 인증 및 지원 대학 작성</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <input type="text" placeholder="학번 (예: 30101)" autocomplete="off" class="px-4 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-burgundy">
          <input type="text" placeholder="이름 (예: 홍길동)" autocomplete="off" class="px-4 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-burgundy">
          <input type="password" placeholder="PIN (4자리)" autocomplete="off" maxlength="4" class="px-4 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-burgundy">
          <button class="bg-burgundy hover:bg-burgundy-hover text-white text-sm font-semibold rounded-xl py-2.5 shadow-sm transition-all">접속하기</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
