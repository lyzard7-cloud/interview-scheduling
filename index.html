<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고등학교 대입 면접 연습 배정 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: {
            sidebar: '#1C1917',
            cream: '#FBF9F5',
            burgundy: { DEFAULT: '#8B263E', hover: '#721F32', light: '#FDF2F4' }
          }
        }
      }
    }
  </script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7xuekPxP9C_JIo586h-XvsbWMM7Lzle0",
      authDomain: "interview-system-b3b6e.firebaseapp.com",
      projectId: "interview-system-b3b6e",
      storageBucket: "interview-system-b3b6e.firebasestorage.app",
      messagingSenderId: "1017259873467",
      appId: "1:1017259873467:web:27440e2d6d496938c6c59e"
    };

    try {
      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.isFirebaseReady = true;
    } catch(e) {
      console.warn("Firebase Init fallback to LocalStorage", e);
      window.isFirebaseReady = false;
    }
  </script>
</head>
<body class="bg-cream text-slate-800 min-h-screen flex font-sans antialiased">
  <!-- 좌측 사이드바 -->
  <aside class="w-64 bg-sidebar text-slate-300 flex flex-col shrink-0 min-h-screen border-r border-stone-800">
    <div class="p-6 border-b border-stone-800 flex items-center space-x-3">
      <div class="w-9 h-9 bg-burgundy rounded-xl flex items-center justify-center text-white font-bold shadow-md">결</div>
      <div>
        <h1 class="font-bold text-white text-base tracking-tight">대입 면접 배정</h1>
        <p class="text-xs text-stone-400">학생부 맞춤형 연습</p>
      </div>
    </div>
    <nav class="p-4 space-y-1.5 flex-1">
      <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-stone-800/80 text-white font-medium">
        <i class="fa-solid fa-calendar-check text-burgundy"></i>
        <span id="navTitle">면접 신청 포털</span>
      </a>
    </nav>
  </aside>

  <!-- 메인 영역 -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white/80 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-30 px-8 py-4 flex justify-between items-center">
      <div>
        <div class="text-xs text-stone-500 mb-1" id="subHeaderBadge">면접 연습 시스템 / 학생 포털</div>
        <h2 class="text-2xl font-bold text-stone-900" id="mainHeaderTitle">면접 연습 신청</h2>
      </div>
      <div id="authStatus" class="text-xs font-semibold text-stone-500"></div>
    </header>

    <main class="p-8 max-w-5xl space-y-6" id="appMain">
      <!-- Step 1: 학생 인증 -->
      <section class="bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm space-y-4">
        <div class="flex justify-between items-center">
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-burgundy-light text-burgundy">STEP 1</span>
        </div>
        <h3 class="text-lg font-bold text-stone-900">학생 인증 및 접속</h3>
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
          <input type="text" id="sNum" placeholder="학번 (예: 30101)" autocomplete="off" class="px-4 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-burgundy">
          <input type="text" id="sName" placeholder="이름 (예: 홍길동)" autocomplete="off" class="px-4 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-burgundy">
          <input type="password" id="sPin" placeholder="PIN (4자리)" autocomplete="off" maxlength="4" class="px-4 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-burgundy">
          <button onclick="handleStudentLogin()" class="bg-burgundy hover:bg-burgundy-hover text-white text-sm font-semibold rounded-xl py-2.5 shadow-sm transition-all">접속하기</button>
        </div>
      </section>

      <!-- Step 2 & 3 영역 (접속 전 숨김) -->
      <div id="stepDetails" class="hidden space-y-6">
        <section class="bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm space-y-4">
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-burgundy-light text-burgundy">STEP 2</span>
          <h3 class="text-lg font-bold text-stone-900">희망 대학 및 학과 작성</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-stone-600 mb-1">희망 대학교</label>
              <input type="text" id="sUniv" placeholder="예: 한국대학교 / 서울대학교" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-burgundy">
            </div>
            <div>
              <label class="block text-xs font-medium text-stone-600 mb-1">희망 학과/전공</label>
              <input type="text" id="sDept" placeholder="예: 컴퓨터공학과 / 경영학과" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:border-burgundy">
            </div>
          </div>
        </section>

        <section class="bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-burgundy-light text-burgundy">STEP 3</span>
            <div class="space-x-2">
              <button onclick="changeMonth(-1)" class="px-3 py-1 border rounded-lg text-xs">◀ 이전달</button>
              <span id="calMonthText" class="font-bold text-sm">2026년 10월</span>
              <button onclick="changeMonth(1)" class="px-3 py-1 border rounded-lg text-xs">다음달 ▶</button>
            </div>
          </div>
          <h3 class="text-lg font-bold text-stone-900">면접 희망 날짜 및 교시 선택</h3>
          
          <div class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-stone-500 py-2 border-b">
            <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
          </div>
          <div id="calGrid" class="grid grid-cols-7 gap-2"></div>

          <div id="slotPicker" class="hidden border-t pt-4 mt-4 space-y-3">
            <h4 class="font-bold text-sm text-stone-800" id="selectedDateTitle">날짜 선택됨</h4>
            <div class="flex gap-3">
              <button onclick="submitReservation(8)" class="flex-1 py-3 border-2 border-burgundy text-burgundy font-bold rounded-xl hover:bg-burgundy hover:text-white transition-all">
                8교시 (16:40 ~ 17:30) 신청
              </button>
              <button onclick="submitReservation(9)" class="flex-1 py-3 border-2 border-burgundy text-burgundy font-bold rounded-xl hover:bg-burgundy hover:text-white transition-all">
                9교시 (17:40 ~ 18:30) 신청
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    let state = {
      user: null,
      year: 2026,
      month: 10,
      selectedDate: null,
      regs: []
    };

    const urlParams = new URLSearchParams(window.location.search);
    const isTeacher = urlParams.get('role') === 'teacher' || urlParams.get('mode') === 'teacher';

    document.addEventListener('DOMContentLoaded', () => {
      if (isTeacher) {
        document.getElementById('navTitle').textContent = '교사 관리자 포털';
        document.getElementById('subHeaderBadge').textContent = '교사 전용 대시보드';
        document.getElementById('mainHeaderTitle').textContent = '전체 면접 배정 및 인쇄';
        renderTeacherView();
      } else {
        renderCalendar();
      }
    });

    function handleStudentLogin() {
      const num = document.getElementById('sNum').value.trim();
      const name = document.getElementById('sName').value.trim();
      const pin = document.getElementById('sPin').value.trim();

      if (!num || !name || pin.length !== 4) {
        alert('학번, 이름, PIN 4자리를 정확히 입력해 주세요.');
        return;
      }

      state.user = { num, name, pin };
      document.getElementById('authStatus').textContent = `${name} (${num}) 학생 접속됨`;
      document.getElementById('stepDetails').classList.remove('hidden');
      alert(`${name} 학생으로 접속되었습니다. STEP 2와 STEP 3를 작성해 주세요.`);
    }

    function changeMonth(delta) {
      state.month += delta;
      if (state.month < 9) state.month = 9;
      if (state.month > 11) state.month = 11;
      document.getElementById('calMonthText').textContent = `${state.year}년 ${state.month}월`;
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calGrid');
      if (!grid) return;
      grid.innerHTML = '';

      const firstDay = new Date(state.year, state.month - 1, 1).getDay();
      const lastDate = new Date(state.year, state.month, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="h-16"></div>`;
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${state.year}-${String(state.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isSelected = state.selectedDate === dateStr;
        grid.innerHTML += `
          <button onclick="selectDate('${dateStr}')" class="h-16 border rounded-xl p-2 text-left flex flex-col justify-between transition-all ${isSelected ? 'border-burgundy bg-burgundy-light font-bold' : 'hover:border-stone-400 bg-white'}">
            <span class="text-xs text-stone-700">${d}</span>
            <span class="text-[10px] text-burgundy font-semibold">예약가능</span>
          </button>
        `;
      }
    }

    function selectDate(dateStr) {
      if (!state.user) {
        alert('STEP 1에서 학번, 이름, PIN 입력 후 [접속하기]를 먼저 눌러주세요.');
        return;
      }
      state.selectedDate = dateStr;
      document.getElementById('selectedDateTitle').textContent = `선택된 날짜: ${dateStr}`;
      document.getElementById('slotPicker').classList.remove('hidden');
      renderCalendar();
    }

    function submitReservation(period) {
      const univ = document.getElementById('sUniv').value.trim();
      const dept = document.getElementById('sDept').value.trim();

      if (!univ || !dept) {
        alert('희망 대학교와 학과/전공을 작성해 주세요.');
        return;
      }

      alert(`[신청 완료]\n\n· 날짜: ${state.selectedDate}\n· 교시: ${period}교시\n· 학생: ${state.user.name} (${state.user.num})\n· 지원: ${univ} ${dept}\n\n정상 접수되었습니다!`);
    }

    function renderTeacherView() {
      const app = document.getElementById('appMain');
      app.innerHTML = `
        <section class="bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="text-lg font-bold text-stone-900">교사 관리자 대시보드</h3>
            <button onclick="window.print()" class="bg-burgundy text-white text-xs px-4 py-2 rounded-xl font-bold">시간표 인쇄 (A4)</button>
          </div>
          <p class="text-sm text-stone-600">학생들의 신청 내역 및 면접관 배정 관리를 진행하실 수 있습니다.</p>
        </section>
      `;
    }

    // 단축키 Ctrl+Shift+K 교사 접속
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'k') {
        const pwd = prompt('교사 비밀번호를 입력하세요:');
        if (pwd === 'teacher123') {
          window.location.href = window.location.pathname + '?role=teacher';
        } else if (pwd) {
          alert('비밀번호가 올바르지 않습니다.');
        }
      }
    });
  </script>
</body>
</html>
