<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고등학교 대입 면접 연습 배정 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 💡 선생님의 실제 Firebase 키가 적용되었습니다.
    const firebaseConfig = {
      apiKey: "AIzaSyD7xuekPxP9C_JIo586h-XvsbWMM7Lzle0",
      authDomain: "interview-system-b3b6e.firebaseapp.com",
      projectId: "interview-system-b3b6e",
      storageBucket: "interview-system-b3b6e.firebasestorage.app",
      messagingSenderId: "1017259873467",
      appId: "1:1017259873467:web:27440e2d6d496938c6c59e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
  <!-- 메인 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
          <i class="fa-solid fa-user-graduate text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900">대입 면접 연습 배정 시스템</h1>
          <p class="text-xs text-slate-500" id="roleBadge">학생용 예약 포털</p>
        </div>
      </div>
      <div id="headerActions"></div>
    </div>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8" id="app">
    <!-- 자바스크립트로 화면 전환 -->
  </main>

  <!-- 푸터 (클릭 이벤트 완전 제거됨) -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-sm text-slate-500">© 고등학교 대입 면접 연습 배정 시스템. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // 기본 시스템 스크립트 및 UI 제어 로직
    const urlParams = new URLSearchParams(window.location.search);
    const isTeacher = urlParams.get('role') === 'teacher' || urlParams.get('mode') === 'teacher';

    document.addEventListener('DOMContentLoaded', () => {
      const badge = document.getElementById('roleBadge');
      if (isTeacher) {
        badge.textContent = '교사 전용 관리자 포털';
        badge.className = 'text-xs text-indigo-600 font-bold';
      }
    });

    // 단축키 교사 진입 (Ctrl + Shift + K)
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'k') {
        const pwd = prompt('교사 비밀번호를 입력하세요:');
        if (pwd === 'teacher123') {
          window.location.href = window.location.pathname + '?role=teacher';
        } else if (pwd) {
          alert('비밀번호가 올바르지 않습니다.');
        }
      }
    });
  </script>
</body>
</html>
